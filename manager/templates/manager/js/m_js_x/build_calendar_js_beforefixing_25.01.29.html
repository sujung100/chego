  function findTdByDate(year, month, day) {
      const formattedDate = `${year}-${leftPad(month)}-${leftPad(day)}`;
      const tds = document.querySelectorAll('.Calendar td');
      for (let td of tds) {
          const p = td.querySelector('p');
          if (p && p.textContent === leftPad(day)) {
              return td; // 해당 날짜의 td 반환
          }
      }
      return null; // 찾지 못한 경우
  }

  function disableMode_choiceDate(newDIV) {
      console.log("disableMode_choiceDate 실행");
      
      let year = nowMonth.getFullYear();
      let month = leftPad(nowMonth.getMonth() + 1);
      let day = newDIV.textContent;
      let disableMode_choice_date = `${year}-${month}-${day}`;

      selectedCount++; // 선택 횟수 증가

      // 홀수 번째 선택
      if (selectedCount % 2 === 1) {
          // 이전 홀수 선택이 있다면 클래스 제거
          if (lastOddChoice) {

          }

          // 기존 짝수 선택이 존재한다면 클래스 제거

              lastEvenChoice = null; // 마지막 짝수 선택 초기화
          }

          newDIV.classList.add("d_choiceDay"); // 현재 선택에 클래스 추가
          lastOddChoice = newDIV; // 마지막 홀수 선택 업데이트
          lastDisabledDate = disableMode_choice_date; // 시작 날짜 업데이트
          disable_date_start.textContent = disableMode_choice_date; // 시작 날짜 설정

          // 상태 업데이트
          selectedDates.start = disableMode_choice_date;
          selectedDates.end = null; // 초기화
          selectedDates.between = []; // 초기화

      } else { // 짝수 번째 선택

          }

          // 현재 선택 날짜가 마지막 선택된 시작 날짜보다 이전인지 확인
          if (lastDisabledDate && disableMode_choice_date < lastDisabledDate) {
              alert("이전 날짜를 종료 날짜로 선택할 수 없습니다.");
              selectedCount--;
              // console.log("선택횟수 출력", selectedCount);
              return; // 이전 날짜 선택 방지
          }

          newDIV.classList.add("choiceDay2"); // 현재 선택에 클래스 추가
          lastEvenChoice = newDIV; // 마지막 짝수 선택 업데이트
          disable_date_end.textContent = disableMode_choice_date; // 종료 날짜 설정
          
          
           // 선택된 td 요소 찾기
          const startTd = lastOddChoice ? lastOddChoice.parentElement : null; // d_choiceDay 클래스가 있는 td
          const endTd = lastEvenChoice.parentElement; // choiceDay2 클래스가 있는 td
          
          // 사이에 between 클래스 추가
          if (startTd) {
              addBetweenClass(startTd, endTd);
              // 상태 업데이트
              selectedDates.end = disableMode_choice_date;
              // between 클래스가 추가된 날짜를 저장
              let currentTd = startTd.nextElementSibling;
              while (currentTd && currentTd !== endTd) {
                  selectedDates.between.push(currentTd.querySelector('p').textContent);
                  currentTd = currentTd.nextElementSibling;
              }
          }
      }

      console.log("현재 짝수 선택:", lastEvenChoice ? lastEvenChoice.textContent : "없음");
      console.log("선택횟수 출력", selectedCount);
  }

  
  function addBetweenClass(startTd, endTd) {
      let currentTd = startTd.nextElementSibling;
      console.log("currentTd", currentTd);

      // startTd의 다음 td부터 endTd까지 반복
      while (currentTd && currentTd !== endTd) {
        const dayParagraphs = currentTd.querySelectorAll('p'); // 현재 td의 모든 p 태그 선택
        dayParagraphs.forEach(p => {
            p.classList.add("between"); // between 클래스 추가
        });
        currentTd = currentTd.nextElementSibling; // 다음 td로 이동
    }
  }

  function removeBetweenClass() {
      const betweenElements = document.querySelectorAll('.between');
      betweenElements.forEach(element => {
          element.classList.remove('between'); // between 클래스 제거
      });
  }

  // input값이 한자리 숫자인 경우 앞에 '0' 붙혀주는 함수
  function leftPad(value) {
    if (value < 10) {
      value = "0" + value;
      return value;
    }
    return value;
  }

  function countDateOccurrences(datesArray, singleDate) {
    let dateString = singleDate.join('-');
    return datesArray.reduce((rsv_count, date) =>
      (date === dateString) ? ++rsv_count : rsv_count,
      0);
  }
