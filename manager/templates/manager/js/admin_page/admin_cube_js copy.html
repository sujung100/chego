  function ExeCution() {

  function MainMap() {
    Object.entries(CubePositions).forEach(([key, value]) => {
      mainMap.set(key, value.main);
    });
    cubeMains.forEach(main => {
      const classes = Array.from(main.classList);
      for (const [key, value] of mainMap.entries()) {

  function CoverMap() {

        }

  function activateDrag(e) {

    // const targetCover = cover_map.get(targetClass);

    if (targetCover) {
      if (e.target === targetCover.querySelector("div") || targetMainside.classList.contains("activate")) {
        // console.log("타겟 예외 처리 잘 되냐");
        e.stopPropagation();
        return;
      }
    }

    const currentClass = Array.from(cube.classList).find(cls => cls in CubePositions);
    cube.requestPointerLock();
    CheckRotateY();
    // cube.addEventListener('mousemove', trackDrag);
    document.addEventListener('mousemove', trackDrag);

    if (currentClass) {
      CubeDeactivation(currentClass);
    }

  }

  function deactivateDrag(e) {
    // console.log("디 액티배이트드래그");
    document.exitPointerLock();
    document.removeEventListener('mousemove', trackDrag);
    snapToNearestPosition();
  }



  function trackDrag(e) {
    requestAnimationFrame(() => {
      const oldRotateX = Number(window.getComputedStyle(document.body).getPropertyValue("--rotateX"));
      const oldRotateY = Number(window.getComputedStyle(document.body).getPropertyValue("--rotateY"));

      // 마우스의 Y축 이동에 따라 X축 회전 (아래로 드래그 시 아래로 회전)
      const newRotateX = oldRotateX + e.movementX * sensitivity;
      // 마우스의 X축 이동에 따라 Y축 회전 (좌우 드래그 시 좌우 회전)
      const newRotateY = oldRotateY + e.movementY * sensitivity;

      // CSS 변수에 새로운 각도 설정
      document.body.style.setProperty('--rotateX', newRotateX);
      document.body.style.setProperty('--rotateY', newRotateY);
    });
  }


  function normalizeAngle(angle) {
    // -180도에서 180도 범위로 변환
    return (angle + 180) % 360 - 180;
  }

  function calculateDistance(currentX, currentY, targetX, targetY) {


    const normalizedCurrentX = normalizeAngle(currentX);
    const normalizedCurrentY = normalizeAngle(currentY);
    const normalizedTargetX = normalizeAngle(targetX);
    const normalizedTargetY = normalizeAngle(targetY);

    // 각도 차이의 절대값 계산
    const distanceX = Math.abs(normalizedCurrentX - normalizedTargetX);
    const distanceY = Math.abs(normalizedCurrentY - normalizedTargetY);

    // Y축의 경우, 반전된 각도를 고려하여 절대값 비교
    const adjustedDistanceY = Math.min(distanceY, 360 - distanceY);

    // 반전된 경우 처리
    const invertedDistanceX = Math.abs(normalizedCurrentX + 180) + Math.abs(normalizedTargetX);
    const invertedDistanceY = Math.abs(normalizedCurrentY + 180) + Math.abs(normalizedTargetY);

    return Math.min(distanceX + adjustedDistanceY, invertedDistanceX + invertedDistanceY); // 총 거리 반환

  }



  function snapToNearestPosition() {
    const oldRotateX = Number(window.getComputedStyle(document.body).getPropertyValue("--rotateX"));
    const oldRotateY = Number(window.getComputedStyle(document.body).getPropertyValue("--rotateY"));

    let closestPosition = null;
    let closestDistance = Infinity;
    const currentClass = Array.from(cube.classList).find(cls => cls in CubePositions);

    // 클래스에 있는 포지션을 제외하고 가장 가까운 포지션 찾기
    for (const [position, { rotateX, rotateY }] of Object.entries(CubePositions)) {
      const totalDistance = calculateDistance(oldRotateX, oldRotateY, rotateX, rotateY);

      // 현재 포지션이 클래스에 있으면 패스
      // if (position === currentClass) {
      //   continue;
      // }

      // 가장 가까운 위치 찾기
      if (totalDistance < closestDistance) {
        closestDistance = totalDistance;
        closestPosition = position;
      }
    }


    // 가장 가까운 위치로 이동

    if (closestPosition) {
      if (currentClass) {
        cube.classList.remove(currentClass);
      }
      requestAnimationFrame(() => {
        cube.style.transition = "all 1s linear";
        // cube.style.transition = "width 2s ease";
        document.body.style.setProperty('--rotateX', CubePositions[closestPosition].rotateX);
        document.body.style.setProperty('--rotateY', CubePositions[closestPosition].rotateY);
        cube.classList.add(closestPosition);
        if (lastAcivation !== true) {
          CubeActivation(closestPosition);
        }

      })
    }
  }



  function RotateCubeJs(e) {
    if (lastCoverDisplay === false) { CoverDisplay(); }
    const targetClass = e.target.className.split(" ")[0];
    const currentClass = Array.from(cube.classList).find(cls => cls in CubePositions);
    currentPosition = targetClass;
    cube.style.transition = "all 1.5s ease";
    CheckRotateY();
    if (currentClass) {
      cube.classList.remove(currentClass);
      CubeDeactivation(currentClass);
    }
    if (CubePositions[targetClass]) {
      document.body.style.setProperty('--rotateX', CubePositions[targetClass].rotateX);
      document.body.style.setProperty('--rotateY', CubePositions[targetClass].rotateY);
      cube.classList.add(targetClass);
      if (lastAcivation !== true) {
        CubeActivation(targetClass);
      }
      // if(!targetMain.classList.contains("activate")){
      // }
    }
  }
