  // 예약 데이터 업데이트
  async function rsvNotification(socket, rsvdata) {
    const currentStoreId = nc.storeManager.storeId; 
    const dataArray = Array.isArray(rsvdata) ? rsvdata : [rsvdata];

    // 데이터 저장 (캐시 업데이트)
    dataArray.forEach(item => {
      const sId = String(item.store_id);
      if (!nc.storeDataCache[sId]) nc.storeDataCache[sId] = [];
      
      // 데이터 중복방지
      if (!nc.storeDataCache[sId].find(d => d.id === item.id)) {
        nc.storeDataCache[sId].push(item);
      }
    });

    // 현재 스토어에 업데이트있나 확인
    const hasCurrentStoreUpdate = dataArray.some(item => String(item.store_id) === String(currentStoreId));

    // 모달 내부 카드 업데이트
    if (hasCurrentStoreUpdate) {
      renderCards(currentStoreId);
    }

    // 알림 업데이트
    updateNoti();
  }

  // 카드순번 지정(카드 이름 New1,2... - 알림 확인 편하게)
  function makeCardNum() {
    const cards = document.querySelectorAll("#reservation-info .card");
    
    cards.forEach((card, index) => {
      let header = card.querySelector(".card-header");
      if (!header) {
        header = document.createElement("div");
        header.classList.add("card-header");
        card.prepend(header);
      }

      let icon = header.querySelector(".card-icon");
      if (!icon) {
        icon = document.createElement("span");
        icon.classList.add("material-symbols-outlined", "card-icon");
        icon.textContent = "event";
        header.appendChild(icon);
      }

      let ctitle = header.querySelector(".card-title");
      if (!ctitle) {
        ctitle = document.createElement("span");
        ctitle.classList.add("card-title");
        header.appendChild(ctitle);
      }
      ctitle.textContent = `New${index + 1}`;
      

      // header.appendChild(icon);
      // header.appendChild(ctitle);

      // 아이콘 컬러랜덤
      changeIconColor(icon, index, cards.length);
    });
  }


  // 활성스토어 화면비우고 데이터추가
  function renderCards(storeId) {
    const reservation_card = document.querySelector("#reservation-info");
    if (!reservation_card) return;

    reservation_card.innerHTML = "";

    const cachedData = nc.storeDataCache[String(storeId)] || [];

    const fieldConfigs = {
      'user_name': { label: '예약자명', className: 'infoName' },
      'user_phone': { label: '연락처', className: 'infoPhone' },
      'reservation_date': { label: '예약일', className: 'infoDate' },
      'user_time': { label: '예약시간', className: 'infoTime' },
      'visitor_num': { label: '방문인원', className: 'infoNum' }
    };
    
    cachedData.forEach(rsvInfo => {
      let card = document.createElement("div");
      card.classList.add("card");
      card.dataset.rid = rsvInfo.id;

      let grid = document.createElement("div");
      grid.classList.add("card-grid");
      card.append(grid);

    // const displayFields = {
    //   'user_name': '예약자명',
    //   'user_phone': '연락처',
    //   'reservation_date': '예약일',
    //   'user_time': '예약시간',
    //   'visitor_num': '방문인원'
    // };

      Object.keys(fieldConfigs).forEach(key => {
        // 데이터가 존재할 때만 생성
        if (rsvInfo[key] !== undefined) {
          const config = fieldConfigs[key];
          let infoDiv = document.createElement("div");
          infoDiv.classList.add(config.className);

          let labelP = document.createElement("p");
          labelP.classList.add("info-label");
          labelP.textContent = config.label;

          let valueP = document.createElement("p");
          valueP.classList.add("info-value");
          let valText = rsvInfo[key];
          if (key === 'visitor_num') valText += "명";
          valueP.textContent = valText;

          infoDiv.appendChild(labelP);
          infoDiv.appendChild(valueP);
          grid.appendChild(infoDiv);
        }
      });
      
      reservation_card.appendChild(card);


      card.addEventListener("click", function () {
        console.log("[Click] 현재 전역 소켓 상태:", manager_webSockets);
        
        const socket = manager_webSockets ? manager_webSockets.manager : null;
        
        if (socket) {
          console.log("[Click] 매니저 소켓 readyState:", socket.readyState);
          if (socket.readyState === 1 || socket.readyState === WebSocket.OPEN) {
            rsvIsRead1(socket, rsvInfo.id);
          } else {
            console.warn("[Click] 소켓 상태가 OPEN이 아님");
          }
        } else {
          console.error("[Click] 전역 manager_webSockets에서 manager를 찾을 수 없음");
        }

        // 화면 제거 및 캐시 필터링 (기존 유지)
        this.remove();
        const sId = String(storeId);
        nc.storeDataCache[sId] = nc.storeDataCache[sId].filter(d => d.id !== rsvInfo.id);
        updateNoti();

        // 카드 삭제후 카드 순번 재정렬
        makeCardNum();
      });
    });

    // 렌더링 후 카드 순번 부여
    makeCardNum();
  }

  // 모달 아이콘 랜덤컬러지정(파랑계열)
  function changeIconColor(iconElement, index, totalCount) {
    // 기준 컬러 #2F6FED 파랑으로 색상채도고정
    const hue = 220;
    const saturation = 83;

    // 명도범위
    const minLightness = 56; // #2F6FED 기준명도
    const maxLightness = 85; // 연한 파랑

    // 아이콘갯수만큼 명도단계 생성
    const step = totalCount > 1 ? index / (totalCount - 1) : 0;
    const lightness = minLightness + (maxLightness - minLightness) * step;
    iconElement.style.backgroundColor = `hsl(${hue}, ${saturation}%, ${lightness}%)`;
  }


  function rsvIsRead1(socket, data) {
    if (socket.readyState === WebSocket.OPEN) {
      socket.send(JSON.stringify({
        "command": "RSV_mark_as_read",
        "rsv_id": data,
      }));

    }
  }
