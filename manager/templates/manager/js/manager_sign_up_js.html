<script>
  (function () {
    var form = document.getElementById("signup-form");
    var username = document.getElementById("manager_id");
    var pw1 = document.getElementById("manager_pwd1");
    var pw2 = document.getElementById("manager_pwd2");
    var phone = document.getElementById("manager_phone");
    var userMsg = document.getElementById("username-msg");
    var pw1Msg = document.getElementById("pw1-msg");
    var pw2Msg = document.getElementById("pw2-msg");
    var phoneMsg = document.getElementById("phone-msg");
    var csrf = document.querySelector("[name=csrfmiddlewaretoken]").value;

    // 규칙은 validators.py와 동일(앞단검증)
    var USERNAME_RE = /^[a-z0-9]{1,16}$/;
    var PHONE_RE = /^010-\d{4}-\d{4}$/;

    var valid = { username: false, password1: false, password2: false, phone: false };
    var timer, seq = 0, submitting = false, composing = false;

    // 메세지 표시
    function show(el, messages, okText) {
      if (messages.length) {
        el.innerHTML = messages.join("<br>");
      } else if (okText) {
        el.textContent = okText;
      } else {
        el.textContent = "";
      }
    }

    // 비밀번호 가리기-보기 토글
    document.querySelectorAll(".pw-toggle").forEach(function (btn) {
      btn.addEventListener("click", function () {
        var input = document.getElementById(btn.dataset.target);
        var icon = btn.querySelector(".material-symbols-outlined");
        var showPw = input.type === "password";
        input.type = showPw ? "text" : "password";
        icon.textContent = showPw ? "visibility" : "visibility_off";
        btn.setAttribute("aria-pressed", showPw);
        btn.setAttribute("aria-label", showPw ? "비밀번호 숨기기" : "비밀번호 보기");
      });
    });

    // 비밀번호 일치여부 확인
    function checkMatch() {
      valid.password2 = pw2.value !== "" && pw1.value === pw2.value;
      if (!pw2.value) { show(pw2Msg, []); return; }
      show(pw2Msg,
        valid.password2 ? [] : ["비밀번호가 일치하지 않습니다."],
        valid.password2 ? "비밀번호가 일치합니다." : "");
    }

    // 전화번호에 - 자동삽입
    phone.addEventListener("input", function () {
      var d = phone.value.replace(/\D/g, "").slice(0, 11);
      if (d.length > 7) d = d.slice(0, 3) + "-" + d.slice(3, 7) + "-" + d.slice(7);
      else if (d.length > 3) d = d.slice(0, 3) + "-" + d.slice(3);
      phone.value = d;

      valid.phone = PHONE_RE.test(phone.value);
      if (!phone.value) { show(phoneMsg, []); return; }
      show(phoneMsg,
        valid.phone ? [] : ["010-1234-5678 형식으로 입력해 주세요."],
        valid.phone ? "올바른 형식입니다." : "");
    });

    // 서버검증 - 아이디형식, 중복, 비밀번호 규칙 받아오기
    // 반환: Promise → 서버에 도달했으면 true, 네트워크 오류면 false
    function validateOnServer() {
      var mySeq = ++seq;   // 늦게 도착한 오래된 응답 무시용
      var body = new URLSearchParams({ username: username.value, password1: pw1.value });

      return fetch("{% url 'validate_signup' %}", {
        method: "POST",
        headers: { "X-CSRFToken": csrf },
        body: body
      })
        .then(function (res) {
          if (!res.ok) throw new Error("server");
          return res.json();
        })
        .then(function (data) {
          if (mySeq !== seq) return true;
          valid.username = USERNAME_RE.test(username.value) && data.username.length === 0;
          valid.password1 = pw1.value !== "" && data.password1.length === 0;
          show(userMsg, data.username, valid.username ? "사용 가능한 아이디입니다." : "");
          show(pw1Msg, data.password1, valid.password1 ? "사용 가능한 비밀번호입니다." : "");
          checkMatch();
          return true;
        })
        .catch(function () { return false; });
    }

    // 아이디 입력처리
    function onUsernameInput() {
      if (composing) return;   // 한글 조합 중에는 건드리지 않음
      clearTimeout(timer);

      // 대문자 -> 소문자로 변환 / 영문 소문자·숫자 외 문자는 제거 / 최대 16자
      var cleaned = username.value.toLowerCase().replace(/[^a-z0-9]/g, "").slice(0, 16);
      var removed = cleaned !== username.value.toLowerCase();   // 대문자→소문자 변환은 '제거'가 아님
      if (cleaned !== username.value) username.value = cleaned;

      if (!username.value && !pw1.value) {
        valid.username = valid.password1 = false;
        show(userMsg, []); show(pw1Msg, []);
        return;
      }
      if (removed) show(userMsg, ["영문 소문자와 숫자만 입력할 수 있습니다."]);
      timer = setTimeout(validateOnServer, 400);
    }

    username.addEventListener("compositionstart", function () { composing = true; });
    username.addEventListener("compositionend", function () {
      composing = false;
      onUsernameInput();
    });
    username.addEventListener("input", onUsernameInput);

    // 비밀번호 입력 처리
    pw1.addEventListener("input", function () {
      clearTimeout(timer);
      if (!username.value && !pw1.value) {
        valid.username = valid.password1 = false;
        show(userMsg, []); show(pw1Msg, []);
      } else {
        timer = setTimeout(validateOnServer, 400);
      }
      checkMatch();
    });
    pw2.addEventListener("input", checkMatch);

    // 제출전 최종 확인
    form.addEventListener("submit", function (e) {
      if (submitting) return;
      e.preventDefault();

      clearTimeout(timer);

      var fields = { username: username, password1: pw1, password2: pw2, phone: phone };

      validateOnServer().then(function (reached) {
        // 서버에 연결 못 했으면 JS 판단은 포기하고 서버 폼 검증에 맡김
        if (!reached) { submitting = true; form.submit(); return; }

        checkMatch();
        valid.phone = PHONE_RE.test(phone.value);
        if (!valid.phone) show(phoneMsg, ["010-1234-5678 형식으로 입력해 주세요."]);

        var firstBad = ["username", "password1", "password2", "phone"]
          .find(function (k) { return !valid[k]; });

        if (firstBad) {
          alert("형식에 맞게 수정해주세요.");
          fields[firstBad].select();
        } else {
          submitting = true;
          form.submit();
        }
      });
    });
  })();
</script>
