  function findTdByDate(year, month, day) {
      const formattedDate = `${year}-${month}-${day}`;
      console.log("formattedDate찍어봐", formattedDate);
      const tds = document.querySelectorAll('tbody td');
        for (let td of tds) {
            const pTag = td.querySelectorAll('p');
            for (let i = 0; i < pTag.length; i++) {
              // console.log(pTag[i].getAttribute('data-date'));
            }
              if (pTag.length > 0 && pTag[0].getAttribute('data-date') === formattedDate) {
                  return td;
              }
        }
      return null; // 찾지 못한 경우
  }

  function disableMode_choiceDate(newDIV) {
      console.log("disableMode_choiceDate 실행");
      
      let year = nowMonth.getFullYear();
      let month = leftPad(nowMonth.getMonth() + 1);
      let day = newDIV.textContent;
      let disableMode_choice_date = `${year}-${month}-${day}`;

      selectedCount++; // 선택 횟수 증가

      // 홀수 번째 선택
      if (selectedCount % 2 === 1) {
          // 이전 홀수 선택이 있다면 클래스 제거
          if (lastOddChoice) {
              lastOddChoice.classList.remove("d_choiceDay");
              removeBetweenClass();
          }

          // 기존 짝수 선택이 존재한다면 클래스 제거
          if (lastEvenChoice) {
              lastEvenChoice.classList.remove("choiceDay2"); // 기존 짝수 선택 클래스 제거
              lastEvenChoice = null; // 마지막 짝수 선택 초기화
          }

          newDIV.classList.add("d_choiceDay"); // 현재 선택에 클래스 추가
          lastOddChoice = newDIV; // 마지막 홀수 선택 업데이트
          lastDisabledDate = disableMode_choice_date; // 시작 날짜 업데이트
          disable_date_start.textContent = disableMode_choice_date; // 시작 날짜 설정

           // 상태 업데이트
          if (!selectedDates) {
              selectedDates = {};
          }
          // if (!selectedDates[year][month]) {
          //     selectedDates[year][month] = { start: null, end: null, between: [] };
          // }
          selectedDates.start = disableMode_choice_date;
          selectedDates.end = null; // 초기화
          selectedDates.between = []; // 초기화

      } else { // 짝수 번째 선택
          // 이전 짝수 선택이 있다면 클래스 제거
          if (lastEvenChoice) {
              lastEvenChoice.classList.remove("choiceDay2");
          }

          // 현재 선택 날짜가 마지막 선택된 시작 날짜보다 이전인지 확인
          if (lastDisabledDate && disableMode_choice_date < lastDisabledDate) {
              alert("이전 날짜를 종료 날짜로 선택할 수 없습니다.");
              selectedCount--;
              // console.log("선택횟수 출력", selectedCount);
              return; // 이전 날짜 선택 방지
          }

          newDIV.classList.add("choiceDay2"); // 현재 선택에 클래스 추가
          lastEvenChoice = newDIV; // 마지막 짝수 선택 업데이트
          disable_date_end.textContent = disableMode_choice_date; // 종료 날짜 설정
          
          
          // 선택된 td 요소 찾기
          const startTd = lastOddChoice ? lastOddChoice.parentElement : null; // d_choiceDay 클래스가 있는 td
          const endTd = lastEvenChoice.parentElement; // choiceDay2 클래스가 있는 td
          
          // 사이에 between 클래스 추가
          if (startTd && endTd) {
            addBetweenClass(selectedDates.start, disableMode_choice_date);
            selectedDates.end = disableMode_choice_date; // 종료 날짜 업데이트
        }
    }

      console.log("선택된 날짜:", disableMode_choice_date);
      console.log("현재 홀수 선택:", lastOddChoice ? lastOddChoice.textContent : "없음");
      console.log("현재 짝수 선택:", lastEvenChoice ? lastEvenChoice.textContent : "없음");
      console.log("선택횟수 출력", selectedCount);
  }

  
  function addBetweenClass(startDate, endDate) {
    const start = new Date(startDate);
    const end = new Date(endDate);

    let currentDate = new Date(start);
    currentDate.setDate(currentDate.getDate() + 1);

    while (currentDate < end) {
        const currentDay = leftPad(currentDate.getDate());
        const currentMonth = leftPad(currentDate.getMonth() + 1);
        const currentYear = currentDate.getFullYear();

        // 해당 날짜에 해당하는 td 찾기
        const td = findTdByDate(currentYear, currentMonth, currentDay);
        if (td) {
            const dayParagraph = td.querySelector('p');
            if (dayParagraph) {
                dayParagraph.classList.add("between"); // between 클래스 추가
            }
        }

        // between 배열에 추가
        selectedDates.between.push(`${currentYear}-${currentMonth}-${currentDay}`);

        currentDate.setDate(currentDate.getDate() + 1); // 다음 날짜로 이동
    }
  }

  function removeBetweenClass() {
      const betweenElements = document.querySelectorAll('.between');
      betweenElements.forEach(element => {
          element.classList.remove('between'); // between 클래스 제거
      });
  }

  }

  // input값이 한자리 숫자인 경우 앞에 '0' 붙혀주는 함수
  function leftPad(value) {
    if (value < 10) {
      value = "0" + value;
      return value;
    }
    return value;
  }


  function countDateOccurrences(datesArray, singleDate) {
    let dateString = singleDate.join('-');
    return datesArray.reduce((rsv_count, date) =>
      (date === dateString) ? ++rsv_count : rsv_count,
      0);
  }



  // 편집모드 켜기

    disable_date_start.textContent = ''

    // location.reload();
