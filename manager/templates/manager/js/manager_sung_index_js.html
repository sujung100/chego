  // input값이 한자리 숫자인 경우 앞에 '0' 붙여주는 함수
  function leftPad(value) {
    return value < 10 ? "0" + value : value;
  }

  // 날짜를 'YYYY-MM-DD' 문자열로 변환 (events 비교용)
  function formatDate(date) {
    return date.getFullYear() + "-" + leftPad(date.getMonth() + 1) + "-" + leftPad(date.getDate());
  }

  // 달력 생성: 테이블 대신 div 그리드로 날짜를 채움
  function buildCalendar() {
    let firstDate = new Date(nowMonth.getFullYear(), nowMonth.getMonth(), 1);       // 이번달 1일
    let lastDate = new Date(nowMonth.getFullYear(), nowMonth.getMonth() + 1, 0);    // 이번달 마지막날
    let prevLastDate = new Date(nowMonth.getFullYear(), nowMonth.getMonth(), 0);    // 이전달 마지막날

    now_year.textContent = nowMonth.getFullYear();              // 연도 숫자 갱신
    now_month.textContent = leftPad(nowMonth.getMonth() + 1);   // 월 숫자 갱신

    dayGrid.innerHTML = "";   // 이전 출력결과 초기화

    // 1. 이번달 1일 요일만큼 이전달 날짜로 앞칸 채우기
    const leadingCount = firstDate.getDay();
    for (let i = leadingCount; i > 0; i--) {
      dayGrid.appendChild(createDayCell(prevLastDate.getDate() - i + 1, true));
    }

    // 2. 이번달 날짜 채우기
    for (let d = 1; d <= lastDate.getDate(); d++) {
      let nowDay = new Date(nowMonth.getFullYear(), nowMonth.getMonth(), d);
      dayGrid.appendChild(createDayCell(d, false, nowDay));
    }

    // 3. 마지막 주를 7칸으로 맞추기 위해 다음달 날짜로 뒷칸 채우기
    const totalCells = leadingCount + lastDate.getDate();
    const trailingCount = (7 - (totalCells % 7)) % 7;
    for (let i = 1; i <= trailingCount; i++) {
      dayGrid.appendChild(createDayCell(i, true));
    }
  }

  // 날짜 한 칸
  function createDayCell(dateNum, isOutside, dateObj) {
    let cell = document.createElement("div");
    cell.className = "day-cell";
    cell.textContent = dateNum;

    if (isOutside) {                       // 이전/다음 달 날짜는 회색 클릭x
      cell.classList.add("outside");
      return cell;
    }

    if (dateObj.getTime() === today.getTime()) {   // 오늘인 경우
      cell.classList.add("today");
    } else if (selectedDate && dateObj.getTime() === selectedDate.getTime()) {  // 선택된 날짜인 경우
      cell.classList.add("selected");
    }

    if (events.includes(formatDate(dateObj))) {   // 일정이 있는 날짜면 점 표시 추가
      let dot = document.createElement("div");
      dot.className = "event-dot";
      cell.appendChild(dot);
    }

    cell.onclick = function () {
      selectedDate = dateObj;
      buildCalendar();   // 선택 상태를 반영하기 위해 다시 그리기
    };

    return cell;
  }

  class NotificationCenter {
    constructor() {
      this.storeDataCache = {}; // 각 스토어별 예약 데이터
      this.storeManager = new StoreManager(); // 스토어 변경 감지
    }

    // 알림창x / 데이터만 캐시에 저장
    addMessageToCache(rsvdata) {
      console.log("[Cache] 캐시에 추가하려는 데이터:", rsvdata);

      const dataArray = Array.isArray(rsvdata) ? rsvdata : [rsvdata];
      dataArray.forEach(item => {
        const sId = String(item.store_id);
        if (!this.storeDataCache[sId]) this.storeDataCache[sId] = [];
        
        // 중복체크 후 저장
        if (!this.storeDataCache[sId].find(d => d.id === item.id)) {
          this.storeDataCache[sId].push(item);
        }
      });
      console.log("[Cache] 현재 전체 캐시 상태:", this.storeDataCache);
      updateNoti();
      // 모달이 열려있다면 즉시 새로고침
      const modal = document.querySelector("#open-modal");
      if (modal && modal.style.display === "flex") {
        renderCards(this.storeManager.storeId);
      }
    }

    // 캐시비우기
    clearCache(storeId) {
      if (storeId) delete this.storeDataCache[storeId];
      else this.storeDataCache = {};
    }
  }

  // api로 데이터불러오기
  async function fetchStoreData(storeId) {
    if (!storeId) {
      console.warn('스토어id없음');
      return [];
    }

    try {
      const response = await fetch(`api/store-times/?store_id=${storeId}`);
      const data = await response.json();

      console.log("[fetchStoreData] 서버가 준 원본 객체 리스트:", data[0]);

      return data[0].map((item, index) => {
        const realDbId = item.id || item.rsv_id || item.pk; 
      
        if (!realDbId) {
          console.error("서버 데이터에 고유 ID 필드 없음! item 구조:", item);
        }
      
        
      return {
        // 기존 알림창/모달 UI용 데이터
        icon: "up",
        title: "새로운 예약",
        subtitle: [item.user_name, item.user_phone, item.reservation_date, item.user_time],
        actions: ["확인"],

        // 로직 처리(캐시, 읽음 처리)를 위해 원본 데이터의 키값들을 그대로 살려서 동봉
        id: item.id || `rsv-${Date.now()}-${index}`, // 고유 ID가 없다면 임시 부여
        store_id: String(storeId),
        user_name: item.user_name,
        user_phone: item.user_phone,
        reservation_date: item.reservation_date,
        user_time: item.user_time,
        visitor_num: item.visitor_num || 1 // 혹시 데이터에 있으면 가져오고 없으면 1명 기본값
      };
    });

    } catch (error) {
      console.error('Error:', error);

      return [];
    }
  }


  // 데이터 전달
  class StoreManager {
    constructor(storeId = null) {
      this.storeId = storeId;
      this.storeData = null;
    }

    async handleClick(inputStoreId) {
      // 현재 선택된 스토어 ID 업데이트
      const targetId = String(inputStoreId);
      this.storeId = targetId;
      console.log(`스토어 전환: ${targetId}`);

      // 새로운 스토어데이터(예약 목록 등) 가져오기
      try {
        let newData = await fetchStoreData(targetId);
        console.log("서버에서 방금 받아온 원본 데이터:", newData);
        
        if (this.storeId !== targetId) {
          console.log(`[요청 무시] 현재 ID(${this.storeId})가 요청 ID(${targetId})와 다름`);
          return;
        }

        if (nc) {
          // 가져온 데이터 캐시에 저장 (+중복제거)
          nc.addMessageToCache(newData);
          
          // 카드 새로고침 & 모달 예약 내역 갱신
          renderCards(targetId);
          updateNoti();
          updateStoreChart(this.storeId);
          drawTimeChart2(this.storeId);
          drawLeadChart3(this.storeId);
        }
      } catch (error) {
        console.error("데이터를 가져오는 중 오류 발생:", error);
      }
      
    }
  }

  // 시계
  function updateClock() {
    const now = new Date();

    let hours = now.getHours();
    const minutes = now.getMinutes();
    const ampm = hours >= 12 ? 'PM' : 'AM';

    // 12시간제
    hours = hours % 12;
    hours = hours ? hours : 12; // 0이면 12로

    // 두 자리 맞추기
    const hh = String(hours).padStart(2, '0');
    const mm = String(minutes).padStart(2, '0');

    document.getElementById('clock').textContent = `${hh}:${mm} ${ampm}`;
  }
  // 최초 실행

  // 1초마다 업데이트

    gradient.addColorStop(0,   'rgba(54, 162, 235, 0.28)');

    gradient.addColorStop(1,   'rgba(54, 162, 235, 0)');


    // 현재스토어만

      // 기존차트 없애기
    if (chartInstances.storeMonthlyChart) {
      chartInstances.storeMonthlyChart.destroy();
    }

    // 커스텀 - 포인트 원
    const ringPlugin = {
      id: 'ringPlugin',
      afterDatasetsDraw(chart) {
        const { ctx } = chart;
        chart.data.datasets.forEach((dataset, i) => {
          const meta = chart.getDatasetMeta(i);
          meta.data.forEach(point => {
            const { x, y } = point.getProps(['x', 'y']);

            // 바깥 링
            ctx.beginPath();
            ctx.arc(x, y, 9, 0, Math.PI * 2);
            ctx.strokeStyle = 'rgba(54, 162, 235, 0.35)';
            ctx.lineWidth = 2;
            ctx.stroke();
            ctx.closePath();

            // 안쪽 점
            ctx.beginPath();
            ctx.arc(x, y, 4.5, 0, Math.PI * 2);
            ctx.fillStyle = 'rgba(54, 162, 235, 1)';
            ctx.fill();
            ctx.strokeStyle = '#fff';
            ctx.lineWidth = 2;
            ctx.stroke();
            ctx.closePath();

  function drawTimeChart2(storeId) {
    const ctx = document.getElementById('timeChart').getContext('2d');

    console.log("캔버스 엘리먼트 확인:", ctx);

    if (!ctx) {
        console.error("HTML에 id가 'timeChart'인 canvas 엘리먼트가 없습니다.");
        return;
    }
    // const context = ctx.getContext('2d');
    // let filtered;

    // 현재스토어만
    const filtered = serverRawData
      .filter(item => item.store_id == storeId)
      .map(item => ({ label: item.user_time, value: item.count }));
    
    console.log("뜨냐", filtered);
    // 인원수 기준 내림차순
    filtered.sort((a, b) => b.value - a.value);

    let countToExtract = 3; // 기본값 3개씩
    if (filtered.length >= 6) {
        countToExtract = 3; // 6개 이상이면 상위3, 하위3 (총 6개)
    } else if (filtered.length >= 4) {
        countToExtract = 2; // 4~5개면 상위2, 하위2 (총 4개)
    } else {
        countToExtract = 1; // 3개 이하면 상위1, 하위1 (총 2개)
    }

    if (filtered.length > 0) {
      // 이미 filtered가 내림차순 정렬(b.value - a.value)되어 있으므로:
      const maxVal = filtered[0].value;
      const minVal = filtered[filtered.length - 1].value;

      // 공동 1등, 공동 꼴등 시간대 배열로 모두 수집 ['14시', '15시']
      const peakTimes = filtered.filter(item => item.value === maxVal).map(item => item.label);
      const minTimes = filtered.filter(item => item.value === minVal).map(item => item.label);

      document.getElementById('peakTimeTxt').innerText = peakTimes.join(', ');
      document.getElementById('minTimeTxt').innerText = minTimes.join(', ');
    } else {
      document.getElementById('peakTimeTxt').innerText = "-시";
      document.getElementById('minTimeTxt').innerText = "-시";
    }

    const topX = filtered.slice(0, countToExtract);          // 상위 N개
    const bottomX = filtered.slice(-countToExtract);       // 하위 N개
    
    // 만약 데이터가 너무 적어서 상위와 하위가 같은 데이터를 가리키는 중복을 방지 (예: 데이터가 1개뿐일 때)
    let finalFilteredData = Array.from(new Set([...topX, ...bottomX]));
    
    // 최종 라벨, 데이터
    const finalLabels = finalFilteredData.map(item => item.label);
    const finalData = finalFilteredData.map(item => item.value);

    // 상위=파랑 / 하위=회색
    const numItems = finalFilteredData.length;
    const half = Math.ceil(numItems / 2);
    
    const dynamicColors = [];
    for (let i = 0; i < numItems; i++) {
        if (i < half) {
            dynamicColors.push('rgba(54, 162, 235, 0.7)'); // 앞쪽 절반=상위(파랑)
        } else {
            dynamicColors.push('rgba(0, 0, 0, 0.2)');      // 뒤쪽 절반=하위(회색)

    console.log("총★", finalFilteredData);
    console.log("라데★", finalLabels);
    console.log("라카★", finalData);

    // 기존차트있으면 제거
    // if (timeChart) {
    //   timeChart.destroy();
    // }
    if (chartInstances.timeChart) {
      chartInstances.timeChart.destroy();
    }
    
    chartInstances.timeChart = new Chart(ctx, {
        type: 'bar', // 세로막대
        data: {
            labels: finalLabels,
            datasets: [{
              data: finalData,   // 필터링된 6개

                    size: 14,

                  padding: {
                    top: 10,
                    bottom: 30
                  }
                },
                // title: { display: false },
                legend: { display: false },
                tooltip: {
                    callbacks: {
                        label: function(context) {
                            return context.raw + '명'; // 툴팁에 "명" 추가

                    // enabled: true

            scales: {

  function drawLeadChart3(storeId) {
    const canvasElement = document.getElementById('leadChart');
    const infoDiv = document.getElementById('leadChartInfo');
    
    if (!canvasElement) return;

    // 해당 스토어 데이터 필터링
    const storeData = leadRawData.filter(item => item.store_id == storeId);

    // 5가지 구간 분류를 위한 초기화
    const segments = {
        '당일': 0,
        '1~2일 전': 0,
        '3~4일 전': 0,
        '5~6일 전': 0,
        '7일+ 전': 0
    };

    // 데이터를 돌며 구간별로 카운트 가산
    storeData.forEach(item => {
        const day = item.lead_day;
        if (day === 0) segments['당일']++;
        else if (day >= 1 && day <= 2) segments['1~2일 전']++;
        else if (day >= 3 && day <= 4) segments['3~4일 전']++;
        else if (day >= 5 && day <= 6) segments['5~6일 전']++;
        else if (day >= 7) segments['7일+ 전']++;
    });

    // 총 예약 건수 계산
    const totalCount = Object.values(segments).reduce((a, b) => a + b, 0);

    // 데이터미존재시 예외 처리
    if (totalCount === 0) {
        // if (leadChart) { leadChart.destroy(); leadChart = null; }
        if (chartInstances.leadChart) {
          chartInstances.leadChart.destroy();
        }
        infoDiv.innerHTML = "예약 데이터가 없습니다.";
        return;
    }

    // 차트에 넣을 라벨/ 데이터 배열
    const finalLabels = Object.keys(segments);
    const finalData = Object.values(segments);

    // sub_txt분석글용 min/max
    let maxVal = -1;
    let maxLabel = '';
    finalLabels.forEach((label, index) => {
        if (finalData[index] > maxVal) {
            maxVal = finalData[index];
            maxLabel = label;
        }
    });

    // 하단 div에 문구 주입
    // infoDiv.innerHTML = `예약일: 방문 <span style="font-weight: bold;">${maxLabel}</span> 예약多`;

   
    const leadTimeSpan = document.getElementById('leadTimeTxt');
    const leadActionSpan = document.getElementById('leadTimeActionTxt');

    if (maxLabel === '당일 예약') {
      leadTimeSpan.innerText = "당일 직전 예약";
      leadActionSpan.innerText = "당일 오전 또는 실시간 알림톡";
    } else {
      const cleanLabel = maxLabel.replace(' 전', ''); // "1~2일" 형태로 정제
      leadTimeSpan.innerText = maxLabel; // "1~2일 전"
      leadActionSpan.innerText = cleanLabel + " 전 집중 광고"; // "1~2일 전 집중 광고"
    }

    // 기존차트 제거
    // if (leadChart) {
    //     leadChart.destroy();
    // }
    if (chartInstances.leadChart) {
      chartInstances.leadChart.destroy();
    }
    
    
    // 도넛 차트 생성
    chartInstances.leadChart = new Chart(canvasElement, {
        type: 'doughnut',
        data: {
            labels: finalLabels,
            datasets: [{
                data: finalData,   
                backgroundColor: [
                    '#767F9E', // 당일
                    '#36A2EB', // 1~2일 전
                    '#EFECE3', // 3~4일 전
                    '#8FABD4', // 5~6일 전
                    '#AED6CF'  // 7일+ 전
                ],
                borderWidth: 0
            }]
        },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            // maintainAspectRatio: true,
            aspectRatio: 1.8,
            interaction: {
                mode: 'index',
                intersect: false // 선에 딱 안맞아도 마우스 인식하게
            },
            plugins: {
                title: {
                  display: true,
                  text: '    예약 리드타임',
                  color: '#000000',
                  font: {
                    size: 14,
                    weight: 'normal',
                  },
                  align: 'start',
                  padding: {
                    top: 10,
                    bottom: 10
                  },
                },
                // title: { display: false },
                // 범례
                legend: { 
                    display: true, 
                    position: 'left',
                    labels: {
                        padding: 6,
                        color: '#000000',
                        font: {
                          size: 12,
                        },
                        boxWidth: 12,
                        boxHeight: 12,
                    }
                },
                tooltip: {
                    enabled: true, // 내장툴팁 켜기
                    mode: 'index',
                    intersect: false,
                    backgroundColor: 'rgba(0, 0, 0, 0.8)',
                    position: 'nearest',
                    callbacks: {
                        label: function(context) {
                            return ` ${context.label}: ${context.raw}건`;
                        }
                    }
                }
            },
        }
    });
  }



  // 차트 토글

  const chartBtns = document.querySelectorAll('.chart-btn');
  const chartPanels = document.querySelectorAll('[data-chart]');

  chartBtns.forEach(btn => {
    btn.addEventListener('click', () => {
      console.log("차트인스턴스", chartInstances);
      const target = btn.dataset.target;

      // 버튼 active 교체
      chartBtns.forEach(b => b.classList.remove('active'));
      btn.classList.add('active');

      // 패널 show/hide
      chartPanels.forEach(panel => {
        if (panel.dataset.chart === target) {
          panel.classList.add('active');
          // chartInstances[target].resize();
        } else {
          panel.classList.remove('active');
        }
      });
    });
  });



  // to do list 할일 리스트
  const API_BASE_URL = '/manager/sung/api/todos/'; 

  let todos = []; // 로컬 상태 전역 관리
  let visibility = 'all';

  // DOM 요소
  const todoForm = document.getElementById('todo-form');
  const todoInput = document.getElementById('todo-input');
  const todoList = document.getElementById('todo-list');
  const filterBtns = document.querySelectorAll('.filters__btn');
  const saveBtn = document.getElementById('save-btn');
  const visChange = document.querySelector('.chg-visible');

  // +일정추가 누르면 form보이기
  function changeVisible() {
    visChange.addEventListener('click', function () {
      if(visChange.classList.contains('show_bt')) {
        visChange.classList.remove('show_bt');
        visChange.style.display = "none";
        todoForm.style.display = "block";
      }
    });
  }
  changeVisible();


  // document.querySelector('[data-filter="all"]').classList.add('active');

  // --- 1. 초기 데이터 로드 (GET) ---
  async function fetchTodos() {
      try {
        // GET 요청
        const response = await fetch(API_BASE_URL); 
        
        if (response.ok) {
            const data = await response.json();
            console.log("DB에서 불러온 데이터:", data);
            
            todos = data; 
            
            render(); 
        } else {
            console.error("데이터 로드 실패:", response.status);
        }
    } catch (error) {
        console.error("네트워크 에러:", error);
    }
  }

  // --- 2. 로컬 추가 (서버 요청 X) ---
  function addTodo(text) {
      const newTodo = {
          id: Date.now(), // 임시 ID (서버 저장 시 DB ID로 교체됨)
          text: text,
          complete: false
      };
      todos.push(newTodo);
      console.log("투두1", todos);
      render();
  }

  // --- 3. 로컬 토글 및 삭제 ---
  function toggleTodo(id) {
      todos = todos.map(todo => 
          todo.id === id ? { ...todo, complete: !todo.complete } : todo
      );
      console.log("투두2", todos);
      render();
  }

  function deleteTodo(id) {
      todos = todos.filter(todo => todo.id !== id);
      console.log("투두3", todos);
      render();
  }

  // --- 4. 전체 저장 (POST - Save 버튼 클릭 시) ---
  async function saveTodos() {
      try {
          const response = await fetch(`${API_BASE_URL}`, {
              method: 'POST',
              headers: {
                  'Content-Type': 'application/json',
                  'X-CSRFToken': getCookie('csrftoken') // Django 보안용
              },
              body: JSON.stringify({ todos: todos })
          });
          console.log("찍어봐", todos);

          if (response.ok) {
              alert('DB에 성공적으로 저장되었습니다!');
              // 저장 후 서버의 최신 ID가 부여된 데이터를 다시 가져옴
              fetchTodos(); 
          } else {
              alert('저장에 실패했습니다.');
          }
      } catch (error) {
          console.error('저장 에러:', error);
      }
  }

  // --- 5. 렌더링 ---
  function render() {
      todoList.innerHTML = '';
      
      const filtered = todos.filter(t => {
          if (visibility === 'complete') return t.complete;
          if (visibility === 'incomplete') return !t.complete;
          return true;
      });

      filtered.forEach(todo => {
          const li = document.createElement('li');
          li.className = `todo-list__item ${todo.complete ? 'complete' : ''}`;
          
          li.innerHTML = `
              <span class="todo-list__item-content" style="cursor:pointer">${todo.text}</span>
              <button class="todo-list__item-remove"><span class="material-symbols-outlined">delete</span></button>
          `;

          li.querySelector('.todo-list__item-content').onclick = () => toggleTodo(todo.id);
          li.querySelector('.todo-list__item-remove').onclick = () => deleteTodo(todo.id);

          todoList.appendChild(li);
      });
  }

  // --- 6. 이벤트 바인딩 ---
  todoForm.addEventListener('submit', (e) => {
      e.preventDefault();
      const text = todoInput.value.trim();
      if (text) {
          addTodo(text);
          todoInput.value = '';
      }
  });


  filterBtns.forEach(btn => {
      btn.onclick = () => {
          filterBtns.forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          visibility = btn.getAttribute('data-filter');
          render();
      };
  });


  saveBtn.addEventListener('click', saveTodos);

  // CSRF 토큰 함수
  function getCookie(name) {
      let cookieValue = null;
      if (document.cookie && document.cookie !== '') {
          const cookies = document.cookie.split(';');
          for (let i = 0; i < cookies.length; i++) {
              const cookie = cookies[i].trim();
              if (cookie.substring(0, name.length + 1) === (name + '=')) {
                  cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                  break;
              }
          }
      }
      return cookieValue;
  }



</script>
