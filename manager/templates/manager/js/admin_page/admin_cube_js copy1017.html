<script>

  window.addEventListener("DOMContentLoaded", () => {
    CubeUnite();
    // init();
  });

  const cube = document.querySelector("#cube");
  // const cubeFaces = cube.querySelectorAll("div");
  let cubeFaces;
  const cubes = document.querySelectorAll(".cube-1, .cube-2, .cube-3, .cube-4, .cube-5, .cube-6");
  // console.log(cubeFaces);
  const cubeButtons = document.querySelector(".cube-nav");
  let cubeImageClass = cube.classList[0];
  let isScaled = false;
  let cubeRect = cube.getBoundingClientRect();
  let cubeWidth = cubeRect.width;
  let cubeHeight = cubeRect.height;
  let cubeCover = document.querySelector("#cube .cover");
  let animationFrameId;  // 애니메이션 프레임 ID를 저장할 변수
  let scaleTimeoutId;     // 크기 변경을 위한 setTimeout ID를 저장할 변수
  const cube1Root = document.querySelector("#root");
  const rotateY = document.querySelector(".rotate-y");

  function CubeUnite() {
    cubeButtons.addEventListener("click", RotateCube);
    // cube.addEventListener("transitionend", enlargeCube);
  }

  function RotateCube(event) {
    const targetNode = event.target.nodeName;
    const targetClass = event.target.className.split(" ")[0]; // 첫 번째 클래스 이름만 가져옴

    if (targetNode === "DIV" && targetClass !== cubeImageClass) {
      // resetScaleTimeout(); // 클릭 시 타이머 초기화
      resetCubeSize();

      // 이전 애니메이션이 진행 중이면 중지
      if (animationFrameId) {
        cancelAnimationFrame(animationFrameId);
      }

      // 초기 상태에서의 처리와 그렇지 않은 경우를 분리
      if (cubeImageClass === "initial-position") {
        
        changeCubeClass(targetClass);
        // cube.style.transform += ` rotateY(${rotationValue}deg)`; // 클릭한 방향으로 회전 추가

      } else {
        animationFrameId = requestAnimationFrame(() => {
          changeCubeClass(targetClass);
          // setTimeout(() => {
          //   changeCubeClass(targetClass);
          // }, 2000);
        });
      }
    }
  }

  function changeCubeClass(newClass) {
    console.log("newClass", newClass);
    const currentTransform = getComputedStyle(cube).transform;
    if (cubeImageClass === "initial-position") {
      cube.classList.remove("rotate-y");
      cube.style.transition = "none";
      // cube.style.transform = currentTransform;
    }
    if (newClass === "front-position") {
      Cube_1EnlargeCube();
    }
    cube.classList.replace(cubeImageClass, newClass);
    cubeImageClass = newClass;
    cubes.forEach(c => {
      c.style.setProperty('--tl-Z', "12.2rem");
    });
    isScaled = false;
  }

  function resetCubeSize() {
    // cube.style.transform = "";
    cubeFaces = cube.querySelectorAll(":scope > div > div > span.active");
    cube1Root.style.display = "none";
    cubeCover.style.display = "block";
    cube.style.transition = "";
    cube.style.width = `${cubeWidth}px`;
    cube.style.height = `${cubeHeight}px`;
    cubes.forEach(c => {
      c.style.setProperty('--tl-Z', "");
      c.style.display = "block";
    });
    // console.log("cubeFaces", cubeFaces);
    cubeFaces.forEach(div => {
      div.classList.remove("active");
    });
  }

  function enlargeCube(event) {
    // let currentCubeFace = cubeImageClass;
    console.log("이벤트가 뭔데", event);
    if (event.propertyName === "transform") {
      Cube_1EnlargeCube();
    }
  }

  function resetScaleTimeout() {
    // 이전 타이머가 설정되어 있다면 제거
    if (scaleTimeoutId) {
      clearTimeout(scaleTimeoutId);
    }
    isScaled = false; // 크기 조정 상태 초기화
  }

  function getTranslateZ() {


    const translateZValue = "22.5rem"; // 원하는 translateZ 값
    cube1Root.style.display = "flex";
    cubes.forEach(c => {
      c.style.setProperty('--tl-Z', translateZValue);
    });

    requestAnimationFrame(() => {
      // cube.style.width = "60%";
      // cube.style.height = "60%";
      cube.style.width = "77.7%";
      cube.style.height = "70%";
    })
  }




  function Cube_1EnlargeCube() {
    console.log("Cube_1EnlargeCube 실행되냐");
    let frontPosition = document.querySelector(".cube-1");
    let frontSpan = document.querySelector(".cover-1 > span");
    let cube1Cover = document.querySelector(".cover-1");
    let cubeActive = document.querySelector(".active");

    cube.style.transition = "";
    setTimeout(() => {
      frontSpan.classList.add("active");
    }, 1500);

    frontPosition.addEventListener("click", function () {
      if (frontSpan.classList.contains("active")) {
        // console.log("클릭 되냐");
        frontSpan.classList.remove("active");
        cube1Cover.style.display = "none";
        cubes.forEach(cube => {
          if (cube !== frontPosition) {
            cube.style.display = "none"; // frontPosition 제외
          }
        });
        getTranslateZ();

      }
    })



  }


</script>
