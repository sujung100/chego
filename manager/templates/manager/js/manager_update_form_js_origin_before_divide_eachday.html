	function hideSiblings(target_p) {
		const siblings = Array.from(target_p.parentElement.children).filter(child => child !== target_p);
		siblings.forEach(sibling => {
			sibling.style.display = 'none';
		});
	}

	// csrf용 쿠키
	function getCookie(name) {
		let cookieValue = null;
		if (document.cookie && document.cookie !== '') {
			const cookies = document.cookie.split(';');
			for (let i = 0; i < cookies.length; i++) {
				const cookie = cookies[i].trim();
				if (cookie.substring(0, name.length + 1) === (name + '=')) {
					cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
					break;
				}
			}
		}
		return cookieValue;
	}

		function resortingAllBts(attachDivId) {
			const attachDiv = document.getElementById(attachDivId);

				console.error(`${attachDivId}없음`);
				return;
			}

			let arrButtons = Array.from(attachDiv.querySelectorAll('button.arrbtn'));
			arrButtons.sort((a, b) => {
				const [aHour, aMinute] = a.textContent.split(':').map(Number);
				const [bHour, bMinute] = b.textContent.split(':').map(Number);
				if (aHour !== bHour) return aHour - bHour;
				return aMinute - bMinute;
			});
			while (attachDiv.firstChild) {
				attachDiv.removeChild(attachDiv.firstChild);
			}
			arrButtons.forEach(button => {
				attachDiv.appendChild(button);
			});
		}

	function getInputValue(parentElement, checkButtonElement, inputElement, containerId) {

		const targetInputVal = sectionData[containerId]?.inputValues;
		let val = inputElement.value;
		let finishBt = document.createElement('button');

		console.log("finishBt ", finishBt.textContent)
		// finishBt.id = 'time-style';
		finishBt.className = `time-innerbox-${storeId}`;

		checkButtonElement.style.display = 'none';

		// items.sort(function (a, b) {
		// 	return new Date('1970/01/01 ' + a) - new Date('1970/01/01 ' + b);
		// });

		parentElement.appendChild(finishBt);

		let timeItems = Array.from(parentElement.querySelectorAll("[class^='time-innerbox']"));

		// 화면상의 모든 버튼을 다시 불러와서 시간 순서대로 정렬
		timeItems.sort((a, b) => {
			return new Date(`1970/01/01 ${a.textContent}`) - new Date(`1970/01/01 ${b.textContent}`);
		});

		parentElement.innerHTML = ''; // 부모 요소의 모든 자식 요소를 제거

		for (let i = 0; i < timeItems.length; i++) {
			parentElement.appendChild(timeItems[i]); // 정렬된 버튼들을 다시 추가
		}
		console.log("비포★", sectionData);

		removeValBtns = [];

		finishBt.addEventListener('click', function (event) {

			const removeVal = inputElement.value;
			removeValBtns.push(removeVal);
			console.log("삭제될 버튼들", removeValBtns)

			if (Array.isArray(targetInputVal)) {
				const addVal = targetInputVal.filter(item => !removeValBtns.includes(item));
				console.log("검증", addVal);

				if (sectionData && sectionData[containerId]) {
					sectionData[containerId].inputValues = addVal;
					console.log(`'${removeValBtns}' 값을 targetInputVal(sectionData)에서 삭제.`, sectionData[containerId].inputValues);
				} else {
					targetInputVal = addVal;
					console.log(`'${removeValBtns}' 값을 targetInputVal 변수에서 삭제.`, targetInputVal);
				}
				console.log("중간★", sectionData);
			} else {
				console.warn("targetInputVal오류");
			}


			inputElement.value = val;
			// inputElement.value = "";

			checkButtonElement.style.display = '';
			console.log("인풋밸류", inputElement.value);
			console.log("디스찍어봐", this);
			this.remove();

			
			
		});
		console.log("애프터★", sectionData);
		
		console.log("삭제됐나", finishBt);

	// 02.15 공통코드로 수정중
	function commonButtonEvent(arrbtn) {

		let buttons = [];
		
		// 버튼생성시, 한번만 이벤트리스너 추가
		arrbtn.addEventListener('click', function (event) {
			event.preventDefault();
			const clickedButton = event.target;
			const attachDivId = clickedButton.parentNode.id;
			console.log("이거찍어보삼1", clickedButton)
			console.log("이거찍어보삼2", attachDivId)
			let address = document.getElementById(attachDivId);

			// 이전 시간input존재시 제거
			let oldTimeInput = document.querySelector('.time-input');
			console.log("타임인풋 찍어봐", oldTimeInput)
			if (oldTimeInput)
				oldTimeInput.remove();
			let oldOkBt = document.querySelector('.ok-button');
			console.log("오케이버튼 찍어봐", oldOkBt)
			if (oldOkBt)
				oldOkBt.remove();
			let oldcloseBt = document.querySelector('.close-button');
			console.log("클로즈버튼 찍어봐", oldcloseBt)
			if (oldcloseBt)
				oldcloseBt.remove();
			// 새 시간 input생성
			let timeInput = document.createElement('input');
			timeInput.setAttribute('type', 'time');
			timeInput.classList.add('time-input');

			// 새 확인 button생성
			let okbt = document.createElement("button");
			okbt.setAttribute("class", "okbt");
			okbt.textContent = "변경";
			okbt.classList.add('ok-button');

			// arrbtn을 삭제해줄 버튼 생성
			let closeButton = document.createElement("button");
			closeButton.classList.add('close-button');
			closeButton.textContent = "삭제";
			// arrbtn.appendChild(closeButton);


			// 시간 입력값 변경시 실행되는 이벤트리스너
			okbt.addEventListener('click', function (e) {
				e.preventDefault();
				// 동일시간 존재여부 확인
				console.log("이이이이이벤트타겟", e.target)
				let buttons = Array.from(address.querySelectorAll('button:not(.ok-button)'));
				console.log("버튼이란게뭐야", buttons)

				for (let button of buttons) {
					// 동일시간존재시, 경고표시후 함수종료
					if (button.value === timeInput.value) {
						alert("이미 존재하는 시간입니다.");
						timeInput.style.display = '';
						return;
					}
				}
				// 동일 시간값 미존재시, 버튼 텍스트와 value값 변경
				arrbtn.textContent = timeInput.value;
				arrbtn.value = timeInput.value;

				

				// 변경된 버튼을 배열에 추가
				buttons.push(arrbtn);
				console.log("!arrbtn버튼값찍어봐라", timeInput.value);
				buttons.sort((a, b) => {
					return a.value.localeCompare(b.value);
				});
				console.log("buttons", buttons)
				for (let i = 0; i < buttons.length; i++) {
					// console.log('!버튼텍스트찍히나 ' + (i + 1) + ' Text: ' + buttons[i].textContent);
					console.log('!버튼값찍히나 ' + (i + 1) + ' Value: ' + buttons[i].value);
				}

				// 기존 모든버튼제거후, 새로 정렬된 버튼 추가
				while (address.firstChild) {
					address.removeChild(address.firstChild);
				}
				for (let button of buttons) {
					address.appendChild(button);
				}
				// 시간입력input제거
				timeInput.remove();
				okbt.remove();
				closeButton.remove();
			});
			closeButton.addEventListener("click", function (e) {
				e.preventDefault();
				// 클릭한 arrbtn 삭제
				arrbtn.remove();
				timeInput.remove();
				okbt.remove();
				closeButton.remove();

				// buttons배열에서 arrbtn제거
				let index = buttons.indexOf(arrbtn);
				if (index > -1) {
					buttons.splice(index, 1);
				}
			});

			// 시간입력input을 버튼 다음에 삽입
			event.target.parentNode.insertBefore(timeInput, event.target.nextSibling);
			event.target.parentNode.insertBefore(okbt, timeInput.nextSibling);
			event.target.parentNode.insertBefore(closeButton, okbt.nextSibling);

		});


	}
