{% load static %}
<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="{% static 'manager/css/manager_login.css' %}?after">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">
  <title>로그인</title>

</head>

<body>
  <div class="blob blob-1"></div>
  <div class="blob blob-2"></div>
  <div id="wrap">
    <div class="box1">
      <div class="content1">
        

          <div class="section1">
            <form method="POST">
              {% csrf_token %}
              <div class="title">로그인</div>

              <div class="form-group">
                <label for="manager_id"></label>
                <input type="text" class="form-control" id="manager_id"
                  name="username" placeholder="아이디" autocomplete="username" required />
                {{ form.username.errors }}
              </div>

              <div class="form-group">
                <label for="manager_pwd"></label>
                <div class="pw-wrap">
                  <input type="password" class="form-control" id="manager_pwd"
                  name="password" placeholder="비밀번호" autocomplete="current-password" required />
                  <button type="button" class="pw-toggle" data-target="manager_pwd"
                    aria-label="비밀번호 보기" aria-pressed="false">
                    <span class="material-symbols-outlined">visibility_off</span>
                  </button>
                </div>
                {{ form.password.errors }}
              </div>

              <!-- <div class="form-group">
                <label for="manager_phone">Phone number:</label>
                <input type="tel" class="form-control" id="manager_phone"
                  name="manager_phone" value="{{ form.phone_number.value|default:'' }}" />
                {{ form.phone_number.errors }}
              </div>

              <div class="form-group">
                <label for="manager_email">Email:</label>
                <input type="email" class="form-control" id="manager_email"
                  name="manager_email" value="{{ form.email.value|default:'' }}" />
                {{ form.email.errors }}
              </div> -->

              <div class="btn-wrap">
                <button type="submit" value="Login" class="btn btn-primary login-bt">로그인</button>
                <a href="{% url 'signup' %}"><button type="button" class="join-bt">회원가입</button></a>
              </div>
            </form>
          </div>
      </div>

    </div>



    <!-- <div class="box2">
      <div class="content2">
        뭔데
        
      </div>
    </div> -->

  </div>


  {% include "manager/js/manager_login_js.html" %}
</body>

</html>
