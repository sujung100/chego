<script>

  window.addEventListener("DOMContentLoaded", () => {
    ExeCution();
  });

  const body = document.body;
  const canvas = document.querySelector(".canvas");
  const cubeButtons = document.querySelector("nav").querySelectorAll("div");
  // const test = document.querySelector("nav" > ".resetbutton");
  // console.log("test", test);
  const cube = document.querySelector("#original");
  let cubeClass = cube.classList[0];
  const sides = document.querySelectorAll(".side");
  const sides2 = document.querySelector(".side");
  const sensitivity = 1; // 민감도 조정 값
  const cubeCovers = document.querySelectorAll("#cover");
  const cubeMains = document.querySelectorAll("#main-side");


  const CubePositions = {
    'front-position': { rotateX: 0, rotateY: 0, main: "front-main", cover: "front-cover" },
    'left-position': { rotateX: 90, rotateY: 0, main: "left-main", cover: "left-cover" },
    'right-position': { rotateX: -90, rotateY: 0, main: "right-main", cover: "right-cover" },
    'top-position': { rotateX: 0, rotateY: 90, main: "top-main", cover: "top-cover" },
    'bottom-position': { rotateX: 0, rotateY: -90, main: "bottom-main", cover: "bottom-cover" },
    'back-position': { rotateX: 180, rotateY: 0, main: "back-main", cover: "back-cover" },
  };

  const cubeSide1 = document.querySelector("#root");
  // let cubeReset;
  let currentPosition;
  const cubeReset = document.querySelector("#resetbutton");
  

  function ExeCution() {
    cube.addEventListener('mousedown', activateDrag);
    cube.addEventListener('mouseup', deactivateDrag);
    requestAnimationFrame(() => {
      UpdateCubeSize();
      for (let item of cubeButtons) {item.addEventListener("click", RotateCubeJs);}
      // if(CubeActivation())
    });

  }

  function MainMap() {
    const mainMap = new Map();
    Object.entries(CubePositions).forEach(([key, value]) => {
      mainMap.set(key, value.main);
    });
    cubeMains.forEach(main => {
      const classes = Array.from(main.classList);
      for (const [key, value] of mainMap.entries()) {
        if (classes.includes(value)) {
          mainMap.set(key, main);
          break;
        }
      }
    });
    return mainMap;
  }

  // console.log("메인맵", MainMap());
  // console.log("커버맵", CoverMap());

  function CoverMap() {
    const coverMap = new Map();
    Object.entries(CubePositions).forEach(([key, value]) => {
      coverMap.set(key, value.cover);
    });
    cubeCovers.forEach(cover => {
      // cover의 클래스 목록을 배열로 변환
      const classes = Array.from(cover.classList);
      // coverMap의 값을 기준으로 일치하는 클래스 찾기
      for (const [key, value] of coverMap.entries()) {
        if (classes.includes(value)) {
          // coverMap에 노드를 추가
          coverMap.set(key, cover); // 클래스와 해당 노드를 매핑
          break; // 첫 번째 일치하는 클래스만 찾으면 반복 종료
        }
      }
    });
    return coverMap;
  }


  function activateDrag(e) {
    const targetClass = cube.className.split(" ")[1];
    const targetCover = CoverMap().get(targetClass);
    const targetMainside = MainMap().get(targetClass)
    currentPosition = Array.from(cube.classList[1]).find(cls => cls in CubePositions)
    if (targetCover) {
      if (e.target === targetCover.querySelector("div") || targetMainside.classList.contains("activate")) {
        console.log("타겟 예외 처리 잘 되냐");
        e.stopPropagation();
        return;
      }
    }

    const currentClass = Array.from(cube.classList).find(cls => cls in CubePositions);
    cube.requestPointerLock();
    CheckRotateY();
    // cube.addEventListener('mousemove', trackDrag);
    document.addEventListener('mousemove', trackDrag);
    cube.style.transition = "";
    if (currentClass) {
      CubeDeactivation(currentClass);
    }

  }

  function deactivateDrag(e) {
    document.exitPointerLock();
    document.removeEventListener('mousemove', trackDrag);
    snapToNearestPosition();
  }



  function trackDrag(e) {
    requestAnimationFrame(() => {
      const oldRotateX = Number(window.getComputedStyle(document.body).getPropertyValue("--rotateX"));
      const oldRotateY = Number(window.getComputedStyle(document.body).getPropertyValue("--rotateY"));

      // 마우스의 Y축 이동에 따라 X축 회전 (아래로 드래그 시 아래로 회전)
      const newRotateX = oldRotateX + e.movementX * sensitivity;
      // 마우스의 X축 이동에 따라 Y축 회전 (좌우 드래그 시 좌우 회전)
      const newRotateY = oldRotateY + e.movementY * sensitivity;

      // CSS 변수에 새로운 각도 설정
      document.body.style.setProperty('--rotateX', newRotateX);
      document.body.style.setProperty('--rotateY', newRotateY);
    });
  }


  function normalizeAngle(angle) {
    // -180도에서 180도 범위로 변환
    return (angle + 180) % 360 - 180;
  }

  function calculateDistance(currentX, currentY, targetX, targetY) {


    const normalizedCurrentX = normalizeAngle(currentX);
    const normalizedCurrentY = normalizeAngle(currentY);
    const normalizedTargetX = normalizeAngle(targetX);
    const normalizedTargetY = normalizeAngle(targetY);

    // 각도 차이의 절대값 계산
    const distanceX = Math.abs(normalizedCurrentX - normalizedTargetX);
    const distanceY = Math.abs(normalizedCurrentY - normalizedTargetY);

    // Y축의 경우, 반전된 각도를 고려하여 절대값 비교
    const adjustedDistanceY = Math.min(distanceY, 360 - distanceY);

    // 반전된 경우 처리
    const invertedDistanceX = Math.abs(normalizedCurrentX + 180) + Math.abs(normalizedTargetX);
    const invertedDistanceY = Math.abs(normalizedCurrentY + 180) + Math.abs(normalizedTargetY);
    // console.log(`Current: (${normalizedCurrentX}, ${normalizedCurrentY}), Target: (${normalizedTargetX}, ${normalizedTargetY})`);

    return Math.min(distanceX + adjustedDistanceY, invertedDistanceX + invertedDistanceY); // 총 거리 반환

  }



  function snapToNearestPosition() {
    const oldRotateX = Number(window.getComputedStyle(document.body).getPropertyValue("--rotateX"));
    const oldRotateY = Number(window.getComputedStyle(document.body).getPropertyValue("--rotateY"));

    let closestPosition = null;
    let closestDistance = Infinity;
    const currentClass = Array.from(cube.classList).find(cls => cls in CubePositions);

    // 클래스에 있는 포지션을 제외하고 가장 가까운 포지션 찾기
    for (const [position, { rotateX, rotateY }] of Object.entries(CubePositions)) {
      const totalDistance = calculateDistance(oldRotateX, oldRotateY, rotateX, rotateY);
      // console.log(`Checking Position: ${position}, Total Distance: ${totalDistance}`);

      // 현재 포지션이 클래스에 있으면 패스
      // if (position === currentClass) {
      //   continue;
      // }

      // 가장 가까운 위치 찾기
      if (totalDistance < closestDistance) {
        closestDistance = totalDistance;
        closestPosition = position;
      }
    }

    // console.log(`Closest Position: ${closestPosition}, Distance: ${closestDistance}`)

    // 가장 가까운 위치로 이동
    // cube.style.transition = "";
    if (closestPosition) {
      if (currentClass) {
        cube.classList.remove(currentClass);
      }
      requestAnimationFrame(() => {
        cube.style.transition = "all 1.5s ease";
        document.body.style.setProperty('--rotateX', CubePositions[closestPosition].rotateX);
        document.body.style.setProperty('--rotateY', CubePositions[closestPosition].rotateY);
        cube.classList.add(closestPosition);
        CubeActivation(closestPosition);
        console.log("closestPosition", closestPosition);

      })
    }
  }



  function RotateCubeJs(e) {
    console.log("여기서 누적?");
    const targetClass = e.target.className.split(" ")[0];
    const currentClass = Array.from(cube.classList).find(cls => cls in CubePositions);
    // console.log(Array.from(cube.classList));
    currentPosition = targetClass;
    cube.style.transition = "all 1.5s ease";
    CheckRotateY();
    // console.log("currentClass", currentClass);
    // console.log("targetClass", targetClass);
    if (currentClass) {
      cube.classList.remove(currentClass);
      CubeDeactivation(currentClass);
    }
    if (CubePositions[targetClass]) {
      document.body.style.setProperty('--rotateX', CubePositions[targetClass].rotateX);
      document.body.style.setProperty('--rotateY', CubePositions[targetClass].rotateY);
      cube.classList.add(targetClass);
      if(!targetMain.classList.contains("activate")){
        CubeActivation(targetClass);
      }
    }
  }

  function CubeActivation(a) {
    console.log("큐브액티배이션");
    let currentCover = CoverMap().get(a);
    console.log("currentCover", currentCover);
    let coverName = currentCover.querySelector(".cover-name");
    currentCover.classList.add("active");
    if (currentCover.classList.contains("active") && coverName) {
      console.log("액티브 없잖아");
      coverName.style.cursor = "pointer";
      SecondCubeActivation(a, coverName, currentCover);
    }
  }

  function CubeDeactivation(d) {
    let previousCover = CoverMap().get(d);
    console.log("previousCover", previousCover);
    if (previousCover) {
      previousCover.classList.remove("active");
    }
  }


  function SecondCubeActivation(m_side, c_name, cover_element) {
    console.log("세컨액티배이션");
    // console.log("currentside", side);
    const targetMain = MainMap().get(m_side);
    const mainInclue = targetMain.querySelector(":first-child");
    c_name.addEventListener("click", function () {
      // console.log("클릭이벤트 됨??");
      cover_element.classList.remove("active");
      cover_element.style.display = "none";
      cubeSide1.style.display = "flex";
      cube.style.width = "85vw";
      cube.style.height = "85vh";
      targetMain.style.display = "block";
      targetMain.classList.add("activate");
      // mainInclue.style.backgroundColor = "#012a23";
      CoverDisplayNone(cover_element);

    }, { once: true });

    if (cubeSide1.style.display === "flex") {
      accessAllChannels();
    }
    if (targetMain.classList.contains("activate")) {
      cubeReset.addEventListener("click", function () {
        SecondCubeDeactivation(cover_element, m_side);
      }, { once: true });
    }
  }


  function SecondCubeDeactivation(c_element, m_side) {
    console.log("액티배이트 아님");
    const targetMain = MainMap().get(m_side);
    // console.log("targetMain", targetMain);
    // const cubeReset = document.querySelector("nav" > ".resetbutton");
    if (targetMain) {
      cubeReset.addEventListener("click", function () {
        c_element.style.display = "flex";
        cubeSide1.style.display = "none";
        cube.style.width = "";
        cube.style.height = "";
        // CoverDisplay();
      }, { once: true });
    }


  }



  function CoverDisplayNone(c_element) {
    cubeCovers.forEach(cover => {
      if (cover !== c_element) {
        cover.style.display = 'none';
      }
    });
  }

  function CoverDisplay() {
    cubeCovers.forEach(cover => {
      cover.style.display = "";
    });
  }

  function CheckRotateY() {
    if (cube.classList.contains("rotate-y")) {
      cube.classList.remove("rotate-y");
    }
  }

  function UpdateCubeSize() {
    const coverName = document.querySelector(".cover-name");
    const size = Math.min(window.innerWidth, window.innerHeight);
    coverFontsize = size * 0.05;
    cube.style.setProperty('--size', `${size / 3}px`);
    coverName.style.setProperty("--fontSize", `${coverFontsize}px`);
    // coverName.style.fontSize = coverFontsize;
  }

</script>
