    let today = new Date(); // 페이지 로드한 날짜 저장
    today.setHours(0, 0, 0, 0); // 비교 편의를 위해 today의 시간을 초기화

    // 달력 생성 - 달마다 테이블 생성후 날짜값 채워넣기
    async function buildCalendar(store_id, start_date, end_date) {

        mainCalendar.classList.remove('hidden');
        mainCalendar.classList.add('visible');
        guide.classList.remove('visible');
        guide.classList.add('hidden');
        signs.classList.add('visible');
        
        nextButton.style.display = "none";
        calendar_id = store_id;

        

        let firstDate = new Date(nowMonth.getFullYear(), nowMonth.getMonth(), 1);   // 이번달 1일
        let lastDate = new Date(nowMonth.getFullYear(), nowMonth.getMonth() + 1, 0);    // 이번달 마지막날

        let tbody_Calendar = document.querySelector(".Calendar > tbody");
        const activateStartDate = new Date(start_date);
        activateStartDate.setHours(0, 0, 0, 0);
        const activateEndDate = new Date(end_date);

        document.getElementById("calYear").innerText = nowMonth.getFullYear();  // 연도 숫자 갱신
        document.getElementById("calMonth").innerText = leftPad(nowMonth.getMonth() + 1);   // 월 숫자 갱신

        while (tbody_Calendar.rows.length > 0) {    // 이전 출력결과가 남아있는 경우 초기화
            tbody_Calendar.deleteRow(tbody_Calendar.rows.length - 1);
        }

        let nowRow = tbody_Calendar.insertRow();    // 첫번째 행 추가           

        for (let j = 0; j < firstDate.getDay(); j++) {  // 이번달 1일의 요일만큼
            let nowColumn = nowRow.insertCell();    // 열 추가
        }
        // 추가
        // const currentDate = localStorage.getItem("selected_date");
        let currentDate = localStorage.getItem("selected_date");
        const selectedStyle = "background:#009476";     // 선택된 날짜의 스타일

        for (let nowDay = new Date(firstDate); nowDay <= lastDate; nowDay.setDate(nowDay.getDate() + 1)) {  // day는 날짜를 저장하는 변수, 이번달 마지막날까지 증가시키며 반복  

            let nowColumn = nowRow.insertCell();    // 새 열 추가
            let newDIV = document.createElement("p");
            newDIV.innerHTML = leftPad(nowDay.getDate());   // 추가한 열에 날짜 입력
            // 추가
            // 선택된 날짜에 스타일 적용
            let formattedDate = `${nowDay.getFullYear()}-${leftPad(nowDay.getMonth() + 1)}-${leftPad(nowDay.getDate())}`;
            
            // 요일코드
            let jsDay = nowDay.getDay();
            // 1~7 (월=1, 일=7)
            let dayCode = (jsDay === 0) ? 7 : jsDay;      
            newDIV.setAttribute('data-date', formattedDate);
            newDIV.setAttribute('data-daycode', String(dayCode));

            if (formattedDate === currentDate) {
                newDIV.style = selectedStyle;
            }

            if (nowDay.getDay() == 6) {                 // 토요일인 경우
                nowRow = tbody_Calendar.insertRow();    // 새로운 행 추가
            }
            
            if (start_date && end_date) {
                const nowDayStripped = new Date(nowDay.getFullYear(), nowDay.getMonth(), nowDay.getDate());
                const todayStripped = new Date(today.getFullYear(), today.getMonth(), today.getDate());
                const activateStartDateStripped = new Date(activateStartDate.getFullYear(), activateStartDate.getMonth(), activateStartDate.getDate());
                const activateEndDateStripped = new Date(activateEndDate.getFullYear(), activateEndDate.getMonth(), activateEndDate.getDate());

                if (nowDay >= activateStartDate && nowDay <= activateEndDate) {
                    if (nowDay < today) {
                        newDIV.className = "pastDay"
                    }
                    else if (nowDayStripped.getTime() == todayStripped.getTime()) {
                        newDIV.className = "today";
                        console.log("투데이 초이스데이", newDIV);
                        newDIV.onclick = function (e) { choiceDate(this, e); }

                    }
                    else {
                        newDIV.className = "futureDay";
                        newDIV.onclick = function (e) { choiceDate(this, e); };
                    }
                } else {
                    // 기간 밖에 있는 날짜에 "pastDay" 클래스 부여
                    newDIV.className = "pastDay";
                }
                // nowDay >= activateStartDate && nowDay <= activateEndDate 조건 끝
            } else {
                if (nowDay < today) {                       // 지난날인 경우
                    newDIV.className = "pastDay";
                }
                else if (nowDay.getFullYear() == today.getFullYear() && nowDay.getMonth() == today.getMonth() && nowDay.getDate() == today.getDate()) { // 오늘인 경우           
                    newDIV.className = "today";
                    newDIV.onclick = function (e) { choiceDate(this, e); }
                }
                else {                                      // 미래인 경우
                    newDIV.className = "futureDay";
                    newDIV.onclick = function (e) { choiceDate(this, e); }
                }
            }

            nowColumn.appendChild(newDIV);
        }
    }

    // input값이 한자리 숫자인 경우 앞에 0붙혀주는 함수
    function leftPad(value) {

        function updateDisabledTimes(storeId, selectedDate) {
            let companyDates = findStoreDates(storeId);
            let disableTimes = [];

            for (let i = 0; i < companyDates.length; i++) {
                if (companyDates[i].user_date && companyDates[i].user_date.includes(selectedDate)) {
                    disableTimes = disableTimes.concat(JSON.parse(companyDates[i].disable_time));
                }
            }

            disableTimes = [...new Set(disableTimes)];
            const timeButtons = document.querySelectorAll(`.time-item-${storeId}, .time-item-${selectedDate}`);

            for (let i = 0; i < timeButtons.length; i++) {
                const buttonTime = timeButtons[i].getAttribute("data-time");
                if (disableTimes.includes(buttonTime)) {
                    timeButtons[i].disabled = true;
                    // 비활성버튼 css스타일 주기
                    timeButtons[i].classList.add('disabled-time');
                    if (timeButtons[i].classList.contains('green')) {

                    }
                } else {
                    timeButtons[i].disabled = false;
                    timeButtons[i].classList.remove('disabled-time');
                }
            }
        }

    // formdata를 body에 바로 보내지말고, json으로 변환해서 보냄
    async function fetchSendForm(formData) {
        // FormData 객체를 일반 객체로 변환
        const formObject = {};
        for (let [key, value] of formData.entries()) {
            formObject[key] = value;
        }

        // 일반 객체를 JSON 문자열로 변환
        const json = JSON.stringify(formObject);

        const baseUrl = window.location.origin;
        const csrfToken = document.querySelector('input[name="csrfmiddlewaretoken"]').value;

        // const response = await fetch("send_msg/", {
        // const baseUrl = window.location.origin;
        // const response = await fetch(`$baseUrl/send_msg/`, {
        const response = await fetch(`${baseUrl}/`, {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'X-CSRFToken': csrfToken
            },
            body: json,
        })
            .then(response => {
                if (!response.ok) {
                    throw new Error('서버 오류');
                }
                localStorage.removeItem('selected_date');
                console.log('localStorage 초기화됨');
                console.log("response", response);
                return response.json();
            })
            .then(data => {
                if (data.status === 'success') {
                    // 성공
                    console.log(data.message);
                    alert("성공적으로 예약되었습니다.")
                    // location.reload();

                } else {
                    // 실패
                    console.log(data.message);
                }
            })
            .catch(error => {
                console.log(error);
                console.log("실패실패실패");
            })
    }


    // submit버튼누르면, 비동기로 데이터보내기
    // 여기는 비동기 함수 두개 실행시킬 함수로 빼기..
    document.getElementById('rsv_post').addEventListener('submit', function (e) {
        e.preventDefault();

        // FormData 객체를 사용하여 폼 데이터 준비
        let formData = new FormData(this);
        // 콘솔 출력- 나중 지우기
        console.log("formData", formData.entries());
        for (let [key, value] of formData.entries()) {
            console.log(`${key}: ${value}`);
        }
        fetchSendForm(formData);
    });


    // 예약시 전화번호 입력칸에 자동 대쉬
    document.querySelector('#detail_user_phone').addEventListener('keyup', function () {
        this.value = this.value
            .match(/\d*/g).join('')
            .match(/(\d{0,3})(\d{0,4})(\d{0,4})/).slice(1).join('-')
            .replace(/-*$/g, '');
    });

</script>
