  //수정
  async function rsvNotification(socket, rsvdata) {
    // 1. 변수 정의 (에러 해결 핵심: 비교하기 전에 반드시 선언!)
    const currentStoreId = nc.storeManager.storeId; 
    const dataArray = Array.isArray(rsvdata) ? rsvdata : [rsvdata];

    // 2. 데이터 저장 (캐시 업데이트)
    dataArray.forEach(item => {
      const sId = String(item.store_id);
      if (!nc.storeDataCache[sId]) nc.storeDataCache[sId] = [];
      
      // 중복 데이터 방지
      if (!nc.storeDataCache[sId].find(d => d.id === item.id)) {
        nc.storeDataCache[sId].push(item);
      }
    });

    // 3. 현재 스토어에 해당하는 업데이트가 있는지 확인
    const hasCurrentStoreUpdate = dataArray.some(item => String(item.store_id) === String(currentStoreId));

    // 4. UI 업데이트 로직 (모달 및 알림 버튼)
    if (hasCurrentStoreUpdate) {
      // 현재 스토어의 예약이 들어왔다면 모달 내부 카드를 다시 그림
      renderReservationCards(currentStoreId);
    }

    // 5. 알림 버튼(noti) 표시 여부 결정
    // (이 함수 내부에서 현재 스토어 ID를 기준으로 체크하도록 설계했으므로 호출만 하면 됩니다)
    updateNotiVisibility();
  }


  // 활성스토어 화면비우고 데이터추가
  function renderReservationCards(storeId) {
    const reservation_card = document.querySelector("#reservation-info");
    if (!reservation_card) return;

    reservation_card.innerHTML = "";

    const cachedData = nc.storeDataCache[String(storeId)] || [];
    
    cachedData.forEach(rsvInfo => {
      let card = document.createElement("div");
      card.classList.add("card");
      card.dataset.rid = rsvInfo.id;

    const displayFields = {
      'user_name': '예약자명',
      'user_phone': '연락처',
      'reservation_date': '예약일',
      'user_time': '예약시간',
      'visitor_num': '방문인원'
    };

      Object.keys(displayFields).forEach(key => {
        // 데이터가 존재할 때만 생성
        if (rsvInfo[key] !== undefined) {
          let cardP = document.createElement("p");
          cardP.textContent = `${displayFields[key]} : ${rsvInfo[key]}`;
          if (key === 'visitor_num') cardP.textContent += "명";

          card.appendChild(cardP);
        }
      });
      
      reservation_card.appendChild(card);

      // 클릭 -> 읽음처리 + 캐시삭제
      card.addEventListener("click", function () {
        rsvIsRead1(socket, rsvInfo.id); // socket은 전역 혹은 인자로 관리
        this.remove();
        const sId = String(storeId);
        
        nc.storeDataCache[sId] = nc.storeDataCache[sId].filter(d => d.id !== rsvInfo.id);
        updateNotiVisibility();
      });
    });
  }

    if (socket.readyState === WebSocket.OPEN) {
