	function showModal(modalId = "modal-1", options = {}) {
		const {
			bodyText = [],
			footerText = [],
			onClose = null
		} = options;

		const modal = document.getElementById(modalId);
		if (!modal) {
			console.warn(`모달"${modalId}" 찾을수없음.`);
			return;
		}

		// 모달 표시
		modal.style.display = "block";

		// 값을 배열로 통일
		const toArray = v => Array.isArray(v) ? v : (v === undefined || v === null ? [] : [String(v)]);

		// 각 컨테이너의 p들에 textContent로 안전하게 할당
		function fillPs(containerSelector, values) {
			const container = modal.querySelector(containerSelector);
			if (!container) return;
			const divs = Array.from(container.querySelectorAll("div"));
			const vals = toArray(values);
			for (let i = 0; i < divs.length; i++) {
			divs[i].textContent = vals[i] !== undefined ? vals[i] : ""; // 값이 없으면 빈 문자열
			}
		}

		fillPs(".modal-body", bodyText);
		fillPs(".modal-footer", footerText);

		// x버튼 닫기
		const closeBtn = modal.querySelector(".close");
		if (closeBtn) {
			closeBtn.onclick = () => {
			modal.style.display = "none";
			if (typeof onClose === "function") onClose();
			};
		}

		// 바깥 클릭 닫기
		modal.onclick = (e) => {
			if (e.target === modal) {
			modal.style.display = "none";
			if (typeof onClose === "function") onClose();
			}
		};
	}

	// csrf용 쿠키
	function getCookie(name) {
		let cookieValue = null;
		if (document.cookie && document.cookie !== '') {
			const cookies = document.cookie.split(';');
			for (let i = 0; i < cookies.length; i++) {
				const cookie = cookies[i].trim();
				if (cookie.substring(0, name.length + 1) === (name + '=')) {
					cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
					break;
				}
			}
		}
		return cookieValue;
	}

		// 버튼들 재정렬
		function resortingAllBts(attachDivId) {
			const attachDiv = document.getElementById(attachDivId);
			if (!attachDiv) {
				console.error(`${attachDivId}없음`);
				return;
			}

			let arrButtons = Array.from(attachDiv.querySelectorAll('button.arrbtn'));
			arrButtons.sort((a, b) => {
				const [aHour, aMinute] = a.textContent.split(':').map(Number);
				const [bHour, bMinute] = b.textContent.split(':').map(Number);
				if (aHour !== bHour) return aHour - bHour;
				return aMinute - bMinute;
			});
			while (attachDiv.firstChild) {
				attachDiv.removeChild(attachDiv.firstChild);
			}
			arrButtons.forEach(button => {
				attachDiv.appendChild(button);
			});
		}

					okbt.remove();
					closeButton.remove();
					return;

				let buttons = Array.from(attach.querySelectorAll('button.arrbtn'));
				for (let button of buttons) {

				if (ctIdx > -1) {
					containerTime[ctIdx] = newValue;
				} else {
					containerTime.push(newValue);
				}

				if (sectionData[containerId]?.inputValues) {
					const targetInputVal = sectionData[containerId].inputValues;
					const idx = targetInputVal.indexOf(oldValue);
					if (idx > -1) {
						targetInputVal[idx] = newValue;
					} else {
						targetInputVal.push(newValue);
					}
					console.log("타겟인풋바 변경후", targetInputVal);
				}

				// 3) 버튼 자체 값 변경
				arrbtn.textContent = newValue;
				arrbtn.value = newValue;

				// 4) 정렬 후 재배치 (arrbtn 버튼만)
				buttons.sort((a, b) => a.value.localeCompare(b.value));
				buttons.forEach(btn => attach.appendChild(btn));   // appendChild는 기존 노드를 이동시킴

				console.log("어태치 찍어봐", attach);
				// 5) 입력 UI 제거
				timeInput.remove();
				okbt.remove();
				closeButton.remove();
			});
			// 삭제버튼 클릭이벤트

				const containerId = attach.id.replace('attachBtns-', '');
				const deleteTime = arrbtn.value;

				// containerTime에서 제거
				const ctIdx = containerTime.indexOf(deleteTime);
				if (ctIdx > -1) containerTime.splice(ctIdx, 1);

				// inputValues에서 제거
				const target = sectionData[containerId]?.inputValues;
				if (target) {
					const idx = target.indexOf(deleteTime);
					if (idx > -1) target.splice(idx, 1);
				}

				arrbtn.remove();
				timeInput.remove();
				okbt.remove();
				closeButton.remove();
			});

			// 시간입력input을 버튼 다음에 삽입

			event.target.parentNode.insertBefore(okbt, timeInput.nextSibling);

		// 화면상의 모든 버튼을 다시 불러와서 시간 순서대로 정렬
		timeItems.sort((a, b) => {
			return new Date(`1970/01/01 ${a.textContent}`) - new Date(`1970/01/01 ${b.textContent}`);
		});

		// 부모 요소의 모든 자식 요소 제거
		parentElement.innerHTML = '';

				if (sectionData && sectionData[containerId]) {
					sectionData[containerId].inputValues = addVal;
					console.log(`'${removeValBtns}' 값을 targetInputVal(sectionData)에서 삭제.`, sectionData[containerId].inputValues);

					targetInputVal = addVal;

				}
				console.log("중간★", sectionData);

			}


			inputElement.value = val;
			// inputElement.value = "";
			inputElement.style.display = '';
			checkButtonElement.style.display = '';
			console.log("인풋밸류", inputElement.value);
			console.log("디스찍어봐", this);
			this.remove();
		});
		
		console.log("삭제됐나", finishBt);
	}

	// top_cont,  bottom_cont 접기
	function openCont() {
		const sectionA = document.getElementById('sectionA');

		// 히스테리시스: 접히는 지점과 펼쳐지는 지점을 다르게 둬서
		// 경계선 부근에서 상태가 계속 뒤집히는 깜박임을 방지합니다.
		// 접힘/펼침을 트리거할 최소 이동량(px). 값이 클수록 둔감해집니다.
		// const DIRECTION_THRESHOLD = 30;
		// const COLLAPSE_AT_Y = 70;  // 이 지점을 넘어서 "아래로" 스크롤하면 접힘
		// const EXPAND_AT_Y = 50;     // 이 지점보다 "위로" 스크롤해야 다시 펼쳐짐
		const DIRECTION_THRESHOLD = 20;
		const COLLAPSE_AT_Y = 70;  // 이 지점을 넘어서 "아래로" 스크롤하면 접힘
		const EXPAND_AT_Y = 20;     // 이 지점보다 "위로" 스크롤해야 다시 펼쳐짐

		let lastY = window.scrollY;
		let ticking = false;

		function handleScroll() {
		const currentY = Math.max(0, window.scrollY); // 모바일 바운스로 인한 음수 방지
		const delta = currentY - lastY;

		if (Math.abs(delta) >= DIRECTION_THRESHOLD) {
			if (delta > 0 && currentY > COLLAPSE_AT_Y) {
			// 아래로 스크롤 -> A 섹션 접기
			sectionA.classList.add('is-collapsed');
			} else if (delta < 0 && currentY < EXPAND_AT_Y) {
			// 위로 스크롤 -> A 섹션 펼치기
			sectionA.classList.remove('is-collapsed');
			}
			lastY = currentY;
		}

		ticking = false;
		}

		window.addEventListener('scroll', function () {
		if (!ticking) {
			window.requestAnimationFrame(handleScroll);
			ticking = true;
		}
		}, { passive: true });
	}
	openCont();

	// 이전, 다음버튼으로 페이지나누기
	const totalSteps = 3;
	let currentStep = 1;

	const stepPages = document.querySelectorAll('.step-page');
	const stepIndicator = document.getElementById('stepIndicator');
	const progressFill = document.getElementById('progressFill');
	const prevBtn = document.getElementById('prevBtn');
	const nextBtn = document.getElementById('nextBtn');

	function renderStep() {
		stepPages.forEach(page => {
			page.style.display = (parseInt(page.dataset.step, 10) === currentStep) ? 'flex' : 'none';
		});
		stepIndicator.textContent = `Page ${currentStep} of ${totalSteps}`;
		progressFill.style.width = `${(currentStep / totalSteps) * 100}%`;
		prevBtn.disabled = currentStep === 1;
		nextBtn.disabled = currentStep === 3;
		nextBtn.textContent = currentStep === totalSteps ? '끝' : '다음';
	}

	prevBtn.addEventListener('click', () => {
		if (currentStep > 1) {
			currentStep -= 1;
			renderStep();
		}
	});

	nextBtn.addEventListener('click', () => {
		if (currentStep < totalSteps) {
			currentStep += 1;
			renderStep();
		}
	});

	renderStep();

	// 인원설정
	function numberStyle(input) {
	const min = input.hasAttribute('min') ? parseFloat(input.min) : -Infinity;
	const max = input.hasAttribute('max') ? parseFloat(input.max) : Infinity;
	const step = parseFloat(input.step) || 1;

	// DOM 구성: container > [btnRem, input, btnAdd]
	const container = document.createElement('div');
	const btnRem = document.createElement('div');
	const btnAdd = document.createElement('div');

	container.className = 'numberstyle-qty';
	btnRem.className = 'qty-btn qty-rem';
	btnAdd.className = 'qty-btn qty-add';
	btnRem.textContent = '-';
	btnAdd.textContent = '+';

	input.parentNode.insertBefore(container, input);
	container.append(btnRem, input, btnAdd);

	// 값 범위 보정 + 버튼 비활성 상태 갱신
	function update(value) {
	let val = parseFloat(value);
	if (isNaN(val)) val = isFinite(min) ? min : 0;
	if (val > max) val = max;
	if (val < min) val = min;

	input.value = val;
	btnAdd.classList.toggle('disabled', val >= max);
	btnRem.classList.toggle('disabled', val <= min);
	}

	btnAdd.addEventListener('click', () => {
	update((parseFloat(input.value) || 0) + step);
	input.dispatchEvent(new Event('change', { bubbles: true }));
	});

	btnRem.addEventListener('click', () => {
	update((parseFloat(input.value) || 0) - step);
	input.dispatchEvent(new Event('change', { bubbles: true }));
	});

	// 직접 입력한 경우에도 범위 보정
	input.addEventListener('change', () => update(input.value));

	update(input.value);
	}
	document.querySelectorAll('input.numberstyle').forEach(numberStyle);


</script>
