{% load static %}
<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="{% static 'manager/css/manager_signup.css' %}?after">
  <title>회원가입</title>

</head>

<body>
  <div id="wrap">
    <!-- <div class="box1">
      <div class="content1">

      </div>

    </div> -->



    <div class="box1">
      <div class="content1">
        <div class="section1">
          <form method="POST">
            {% csrf_token %}
            <div class="title">회원가입</div>

            <div class="form-group">
              <label for="manager_id"></label>
              <input type="text" class="form-control" id="manager_id"
                name="username" value="{{ form.username.value|default:'' }}" placeholder="아이디" required />
              {{ form.username.errors }}
            </div>
            <div class="form-group">
              <label for="manager_pwd"></label>
              <input type="password" class="form-control" id="manager_pwd1"
                name="password1" value="{{ form.password1.value|default:'' }}" placeholder="비밀번호" required />
              {{ form.password1.errors }}
            </div>
          
            <div class="form-group">
              <label for="manager_pwd"></label>
              <input type="password" class="form-control" id="manager_pwd2"
                name="password2" value="{{ form.password2.value|default:'' }}" placeholder="비밀번호 확인" required />
              {{ form.password2.errors }}
            </div>
            <div class="form-group">
              <label for="manager_phone"></label>
              <input type="tel" class="form-control" id="manager_phone"
                name="phone_number" value="{{ form.phone_number.value|default:'' }}" placeholder="핸드폰 번호" required/>
              {{ form.phone_number.errors }}
            </div>
            <!-- <div class="form-group">
              <label for="manager_email">Email:</label>
              <input type="email" class="form-control" id="manager_email"
                name="email" value="{{ form.email.value|default:'' }}" />
              {{ form.email.errors }}
            </div> -->
            <div class="btn-wrap">
              <button type="submit" class="btn btn-join">회원가입</button>
            </div>
          </form>
        </div>
      </div>
    </div>

  </div>



</body>

</html>
