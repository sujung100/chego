<script>
    const txt = document.querySelector('.ad_text');
    const sideEle = document.querySelector('#sample6_postcode');
    const originTxt = txt.value;
    const searchIcon =  document.querySelector('.search_icon');
    console.log("찍어봐라", originTxt);
    // 애니메이션 동작중여부
    let isAnimating = false;

    // id, 스토어명
    const stores = {{ stores_json|safe }};
    console.log("스토어", stores);
    const storesContainer = document.querySelector('.stores');
    let lastClicked = null;
    let selectedStoreId = null;

    // 기본 url (파라미터 안붙은)
    const urlSample1 = document.getElementById('click1').getAttribute('href');
    const urlSample2 = document.getElementById('click2').getAttribute('href');
    const urlSample3 = document.getElementById('click3').getAttribute('href');


    // 우편번호 찾기버튼 사이즈조정
    function resizeText() {
        const width = sideEle.offsetWidth;
        const txtWidth = txt.offsetWidth;
        if (!txt) return;


        if (width <= 300) {
            txt.value = '찾기';
            if (txtWidth <= 55 && txt.value == '찾기') {
                txt.style.padding = '0.3rem';
            } else if (txtWidth <= 35 && txt.value == '찾기') {
                txt.value = '';
                searchIcon.style.display = 'block';
            }
        }
        else {
            if (txt.value.trim() !== originTxt) {
                txt.value = originTxt;
                console.log("걸리나");
            }
        }
        console.log("돼?");
    }
    resizeText();

    window.addEventListener('resize', resizeText);
    window.addEventListener('load', resizeText);

    // 홈바 클릭값 저장 + 모달열기
    const buttonsABC = ['click1', 'click2', 'click3'];
    buttonsABC.forEach(id => {
        const btn = document.getElementById(id);
        if (btn) {
            btn.addEventListener('click', (e) => {
                e.preventDefault();
                lastClicked = id;
                
                if (modal.classList.contains('hideModal')) {
                    openTv();
                }
            });
        }
    });

    // 스토어 정보 가져와서 버튼생성
    function createStoreBtns() {
        storesContainer.innerHTML = '';
        stores.forEach(([id, store_name]) => {
            const btn = document.createElement('button');
            btn.setAttribute('data-id', id);
            btn.textContent = store_name;
            btn.addEventListener('click', () => {
                selectedStoreId = id;
                console.log("선택매장아이디", selectedStoreId);
                Array.from(storesContainer.children).forEach(b => b.classList.remove('selected'));
                btn.classList.add('selected');
            });
            storesContainer.appendChild(btn);
        });
    }

    document.addEventListener('DOMContentLoaded', createStoreBtns);


    // 이동 버튼 클릭시 페이지이동(store_id전송 -> pk)
    document.getElementById('sendInfo').addEventListener('click', (e) => {
        e.preventDefault();
        
        if (!lastClicked) {
        alert('이동할 홈 메뉴를 클릭하세요.');
        return;
        }
        if ((lastClicked === 'click1' || lastClicked === 'click2') && !selectedStoreId) {
        alert('설정으로 이동할 상점을 선택하세요.');
        return;
        }
        let targetUrl = '';
        if (lastClicked === 'click1') {
        // 템플릿에 쿼리파라미터 넣어야하는곳은 임의숫자 0을 임시로 넣어놈
        targetUrl = urlSample1.replace('/0/', `/${selectedStoreId}/`);
        } else if (lastClicked === 'click2') {
        targetUrl = urlSample2.replace('/0/', `/${selectedStoreId}/`);
        } else if (lastClicked === 'click3') {
        targetUrl = urlSample3;
        }

        window.location.href = targetUrl;
    });


    const modal = document.getElementById('modal');
    const modalContent = modal.querySelector('div');
    const closeBtn = modal.querySelector('.modal-close');
    const topDiv = document.getElementById('topDiv');
    const bottomDiv = document.getElementById('bottomDiv');

    // x눌러 닫기
    closeBtn.addEventListener('click', function(e) {
        e.preventDefault();
        // modal.classList.add('hideModal');
        closeTv();
    });

    // 모달 바깥 클릭닫기
    modal.addEventListener('click', function(e) {
        if (e.target === modal) { 
            closeTv();
        }
    });
    
    // TV켜짐 - 모달열기
    function openTv() {
        // 동작중 재동작에러방지
        if (isAnimating) return;
        isAnimating = true;

        // 초기셋
        modal.classList.remove('hideModal');
        topDiv.style.height = "50%";
        bottomDiv.style.height = "50%";
        
        // 가로선처럼
        modalContent.style.width = "0%";
        modalContent.style.height = "2px";
        modalContent.style.padding = "0";
        modalContent.style.overflow = "hidden";
        modalContent.style.opacity = "1";

        // 가로선 -> 양옆퍼짐
        const lineAnim = modalContent.animate([
            { width: "0%", left: "50%", transform: "translate(-50%, -50%)" },
            { width: "600px", left: "50%", transform: "translate(-50%, -50%)" }
        ], {
            duration: 400,
            easing: 'ease-out',
            fill: 'forwards'
        });

        lineAnim.onfinish = () => {
            // 위아래 검은막 개방
            topDiv.animate([{ height: "50%" }, { height: "0%" }], { duration: 400, fill: 'forwards' });
            bottomDiv.animate([{ height: "50%" }, { height: "0%" }], { duration: 400, fill: 'forwards' });

            // 가로선 -> 모달창 확장
            modalContent.animate([
                { height: "2px", padding: "0" },
                { height: "auto", padding: "2rem 5rem 5rem 5rem" }
            ], {
                duration: 300,
                easing: 'ease-out',
                fill: 'forwards'
            });
            isAnimating = false;
        };
    }

    // TV꺼짐 - 모달닫기
    function closeTv() {
        // 동작중 재동작에러방지
        if (isAnimating) return;
        isAnimating = true;

        // 위아래 검은막 닫기
        const topAnim = topDiv.animate([
            { height: "0%" },
            { height: "50%" }
        ], { duration: 400, fill: 'forwards', easing: 'ease-in' });

        const bottomAnim = bottomDiv.animate([
            { height: "0%" },
            { height: "50%" }
        ], { duration: 400, fill: 'forwards', easing: 'ease-in' });

        // 막이닫히는시점에
        bottomAnim.onfinish = () => {
            // 모달 -> 가로선
            modalContent.style.overflow = "hidden";
            
            const shrinkHeight = modalContent.animate([
                { height: "auto", padding: "2rem 5rem 5rem 5rem" },
                { height: "2px", padding: "0" }
            ], {
                duration: 300,
                fill: 'forwards'
            });

            shrinkHeight.onfinish = () => {
                // 가로선 -> 중앙 점
                const shrinkWidth = modalContent.animate([
                    { width: "600px", left: "50%", transform: "translate(-50%, -50%)" },
                    { width: "0%", left: "50%", transform: "translate(-50%, -50%)" }
                ], {
                    duration: 300,
                    fill: 'forwards'
                });

                shrinkWidth.onfinish = () => {
                    modal.classList.add('hideModal');
                    isAnimating = false;
                };
            };
        };
    }
</script>
