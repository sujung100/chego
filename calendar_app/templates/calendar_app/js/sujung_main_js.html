    //--- 달력 갱신시간 세팅(base_date / renewal_cycle) 시작

    // YYYY-MM-DD -> Date
    function ymdToLocalDate(ymd) {
        if (!ymd) return null;
        const parts = String(ymd).split('-').map(Number);
        if (parts.length !== 3 || parts.some(v => Number.isNaN(v))) return null;
        return new Date(parts[0], parts[1] - 1, parts[2]);
    }

    // //////
    // 날짜 비교(날짜 객체 기준)
    function isDateGreater(aYmd, bYmd) {
        const a = ymdToLocalDate(aYmd);
        const b = ymdToLocalDate(bYmd);
        if (!a || !b) return false;
        return a.getTime() > b.getTime();
    }

    // 구간 비교: target이 (start 부터 end 까지) 구간에 포함되는지 (inclusive)
    function isWithinRangeInclusive(targetYmd, startYmd, endYmd) {
        const t = ymdToLocalDate(targetYmd);
        const s = ymdToLocalDate(startYmd);
        const e = ymdToLocalDate(endYmd);
        if (!t || !s || !e) return false;
        return t.getTime() >= s.getTime() && t.getTime() <= e.getTime();
    }

            let matched = false;
            for (let i = 0; i < ranges.length; i++) {

                    if (isDateGreater(dt, todayYmd)) {

                    el.classList.add('date-future-white');
                    }
                    matched = true;
                    break; // 하나의 구간만 만족하면 됨
                }
            }

            // matched가 false면 기본 색 유지(이미 date-default-dark 적용됨)
        });
    }

    // Date -> YYYY-MM-DD
    function dateToYmd(d) {
        const y = d.getFullYear();
        const m = String(d.getMonth() + 1).padStart(2, '0');
        const day = String(d.getDate()).padStart(2, '0');
        return `${y}-${m}-${day}`;
    }

    // 해당 연도/ 월의 마지막 날짜 반환
    function lastDayOfMonth(year, monthZeroBased) {
        return new Date(year, monthZeroBased + 1, 0).getDate();
    }

    // 기준일referenceYmd(최초기준일basedate & 갱신기준일prevApplyDate) -> cycle적용 -> 적용일 구하기(applyDate)
    function computeApplyDate(referenceYmd, cycle) {
        const ref = ymdToLocalDate(referenceYmd);
        if (!ref) return null;

        if (cycle === 'week') {
            const dayOfWeek = ref.getDay();
            // 다음 주 일요일까지의 남은 일수 계산:
            // 일요일(0) => addDays = 7
            // 수요일(3) => addDays = 11 (다음 주 일요일)
            const addDays = ((7 - dayOfWeek) % 7) + 7;
            const nd = new Date(ref);
            nd.setDate(nd.getDate() + addDays);
            return dateToYmd(nd);
        }

        if (cycle === 'month') {
            const y = ref.getFullYear();
            const m0 = ref.getMonth();
            const nextMonth0 = m0 + 1;
            const targetYear = y + Math.floor(nextMonth0 / 12);
            const targetMonth0 = nextMonth0 % 12;
            const lastDay = lastDayOfMonth(targetYear, targetMonth0);
            const nd = new Date(targetYear, targetMonth0, lastDay);
            return dateToYmd(nd);
        }

        if (cycle === 'year') {
            const y = ref.getFullYear();
            const m0 = ref.getMonth();
            const targetYear = y + 1;
            const lastDay = lastDayOfMonth(targetYear, m0);
            const nd = new Date(targetYear, m0, lastDay);
            return dateToYmd(nd);
        }

        return null;
    }

    // 달력날짜값 YYYY-MM-DD 형태로 (불필요한요소들 제거)
    function extractYmd(raw) {
        if (!raw && raw !== 0) return null;
        const s = String(raw).trim();
        const m = s.match(/(\d{4}-\d{1,2}-\d{1,2})/);
        if (m && m[1]) {
            const parts = m[1].split('-').map(Number);
            if (parts.length === 3 && !parts.some(isNaN)) {
            const y = parts[0];
            const mm = String(parts[1]).padStart(2, '0');
            const dd = String(parts[2]).padStart(2, '0');
            return `${y}-${mm}-${dd}`;
            }
        }
        const m2 = s.match(/(\d{8})/);
        if (m2) {
            const v = m2[1];
            return `${v.slice(0,4)}-${v.slice(4,6)}-${v.slice(6,8)}`;
        }

        // 실패시 null
        return null;
    }

    // 오늘날짜 확인후, applyDate 계산/연장/갱신
    function resetCalPeriod(storeId) {
        console.log("2 리셋피리어드 실행");

        // 전역 투데이 변환중
        const year = today.getFullYear(); 
        const month = String(today.getMonth() + 1).padStart(2, '0');
        const day = String(today.getDate()).padStart(2, '0');
        const fixedToday = `${year}-${month}-${day}`;


        // const fixedToday = document.querySelector('.today')?.getAttribute('data-date') || null;
        console.log("고정투데이", fixedToday);
        if (!fixedToday) return;

        const store = stores.find(s => String(s.id) === String(storeId));
        if (!store) return;

        const rawBase = store.base_date;
        const base = extractYmd(rawBase);
        const cycle = store.renewal_cycle;
        if (!base) {
            console.warn('base_date 없음/오류:', store.id, rawBase);
            return;
        }

        const entry = ensureEntry(storeId);
        console.log("엔트리", entry);
        if (!entry.applyDate) {
            // 최초 : base기준
            const initialApply = computeApplyDate(base, cycle);
            if (!initialApply) {
            console.warn('초기applyDate없음/수동갱신 또는 오류', storeId, base, cycle);
            return;
            }
            // prevApplyDate(이전값)는 없음
            entry.applyDate = initialApply;
            console.log("최초기준", initialApply)
        }

        // 기준(reference)는 prevApplyDate가 있으면 prevApplyDate, 없으면 base
        // entry.prevApplyDate가 null이 아닌 경우만
        const referenceForCalc = entry.prevApplyDate || base;

        const newComputedApply = computeApplyDate(referenceForCalc, cycle);
        if (!newComputedApply) {
            console.warn('computed apply 실패', storeId, referenceForCalc, cycle);
            return;
        }

        // newComputedApply가 entry.applyDate와 다르면 갱신
        if (newComputedApply !== entry.applyDate) {
            // prev에 직전값(entry.applyDate) 저장 & apply값 갱신
            setApplyDateForStore(storeId, newComputedApply);
        }

        // 연장
        if (fixedToday >= entry.applyDate) {
            // reference는 prevApDate, 없으면 현재 applyDate 사용
            let reference = entry.prevApplyDate || entry.applyDate;

            let newApply = computeApplyDate(reference, cycle);
            if (!newApply) {
            console.warn('computeApplyDate 실패', storeId, reference, cycle);
            return;
            }

            console.log('storeId', storeId);
            console.log('today(raw)', fixedToday);
            console.log('entry.applyDate', entry.applyDate);
            console.log('entry.prevApplyDate', entry.prevApplyDate);
            console.log('reference used', reference);
            console.log('first newApply', newApply);
            console.log('compare (newApply <= today):', newApply <= fixedToday);

            // 오늘보다 이전이거나 같으면 반복 연장해서 미래 날짜로 만듦
            // (maxIterations: 무한루프 방지)
            const maxIterations = 100;
            let iter = 0;
            while (newApply <= fixedToday && iter < maxIterations) {
            reference = newApply;
            newApply = computeApplyDate(reference, cycle);
            if (!newApply) {
                console.warn('computeApplyDate 반복 실패', storeId, reference, cycle);
                return;
            }
            iter++;
            }
            if (iter >= maxIterations) console.warn('연장 반복 최대치 도달', storeId);

    //--- 달력 휴무설정 세팅 시작
    function startOfWeek(date) {
        // 주의 시작일: 월 기준 -> diffToMon으로 월요일까지의 거리계산 -> 인자가 속한 월요일반환
        const d = new Date(date.getFullYear(), date.getMonth(), date.getDate());
        const day = d.getDay(); // getDay:  0=Sun,1=Mon...
        const diffToMon = (day === 0) ? -6 : (1 - day);
        // console.log("일자", d)
        // console.log("겟데이요일값", day)
        // console.log("거리값", diffToMon)
        d.setDate(d.getDate() + diffToMon);
        d.setHours(0,0,0,0);
        return d;
    }
    function calcWeekGap(baseYmd, targetYmd) {
        // 주 차 계산
        const base = ymdToLocalDate(baseYmd);
        const target = ymdToLocalDate(targetYmd);
        if (!base || !target) return null;
        // 기준일과 타겟일의 월요일반환
        const baseWeekStart = startOfWeek(base);
        const targetWeekStart = startOfWeek(target);
        const diffMs = targetWeekStart.getTime() - baseWeekStart.getTime();
        // 주 차를 정수로(0이면 같은주)
        return Math.floor(diffMs / (7 * 24 * 3600 * 1000));
    }
    // function isDateBefore(aYmd, bYmd) {
    //     const a = ymdToLocalDate(aYmd); const b = ymdToLocalDate(bYmd);
    //     if (!a || !b) return false;
    //     return a.getTime() < b.getTime();
    // }
    function compareDate(aYmd, bYmd) {
        // YYYY-MM-DD끼리 비교해서 앞, 같음여부 판단(T/F)
        const a = ymdToLocalDate(aYmd); const b = ymdToLocalDate(bYmd);
        if (!a || !b) return false;
        return a.getTime() <= b.getTime();
    }

    // day string -> daycode mapping (mon..sun -> 1..7)
    const DAY_MAP = { mon:1, tue:2, wed:3, thu:4, fri:5, sat:6, sun:7 };

    // 데이터파싱
    function readDayoffData() {
        const el = document.getElementById('dayoff-data');
        if (!el) {
            console.warn('dayoff-data element not found');
            return [];
        }
        try {
            return JSON.parse(el.textContent || '[]');
        } catch (e) {
            console.error('dayoff data 파싱오류', e);
            return [];
        }
    }

    // storeId -> { base_date, dayoff_cycle, dayoffs: ['wed','thu'], store_name }
    function mappingDayoff(dayoffArray) {
        const map = new Map();
        dayoffArray.forEach(s => {
            const id = String(s.id);
            const base = extractYmd(s.base_date);
            const cycle = s.dayoff_cycle;
            const dayoffs = Array.isArray(s.dayoffs) ? s.dayoffs.map(x => String(x).toLowerCase()) : [];
            map.set(id, { base_date: base, dayoff_cycle: cycle, dayoffs: dayoffs, store_name: s.store_name });
        });
        return map;
    }

    // 날짜요소 휴무적용판단
    function calcCycle(storeEntry, dateYmd, dateDaycode, todayYmd) {
        if (!storeEntry) return false;
        if (!storeEntry.base_date) return false;
        const base = storeEntry.base_date;
        const cycle = storeEntry.dayoff_cycle;
        const dayoffs = storeEntry.dayoffs || [];

        // 1) 기준일 이후?
            // date < base -> 적용안함
        if (!compareDate(base, dateYmd)) return false; 

        // 2) 매장 휴무 요일에 포함?
            // dateDaycode는 1..7, dayoffs는 ['mon','wed',...]
        if (!dayoffs.length) return false;
        const wantedCodes = new Set(dayoffs.map(d => DAY_MAP[d])).values ? new Set(dayoffs.map(d => DAY_MAP[d])) : new Set();
        if (!wantedCodes.has(Number(dateDaycode))) return false;

        // 3) 주기 판단
        if (!cycle || cycle === '무휴') return false;

        // 주 차 계산 (기준주, 타겟주)
        const wi = calcWeekGap(base, dateYmd);
        if (wi === null) return false;

        // 기준일 포함 매주
        if (cycle === '매주') {
            return wi >= 0;
        }
        // 기준일 주부터 격주 (0,2,4...)
        if (cycle === '이휴') {
            return wi >= 0 && (wi % 2 === 0);
        }
        // 기준일 다음주부터 격주 weekIndex >=1, (weekIndex-1) even
        if (cycle === '다휴') {
            return wi >= 1 && ((wi - 1) % 2 === 0);
        }
        // 기타
        return false;
    }

    // css적용
    function dayoffCss(dateSelector, todayYmd) {
        const raw = readDayoffData();
        const map = mappingDayoff(raw);

        const els = document.querySelectorAll(dateSelector);
        if (!els) return;

        els.forEach(el => {
            const dt = el.getAttribute('data-date'); // YYYY-MM-DD
            const dc = el.getAttribute('data-daycode'); // 1~7
            const sid = el.getAttribute('data-store-id'); // storeId
            if (!dt || !dc) return;

            // 매장별 달력이면 sid로, 아니면 map의 모든 항목 검사
            let apply = false;
            // console.log("시드", sid);
            if (sid) {
                const entry = map.get(String(sid));
                apply = calcCycle(entry, extractYmd(dt), Number(dc), todayYmd);
            } else {
                // 여러 매장 겹침 불가: map.values().next()로 첫 항목 사용
                const entry = map.values().next().value;
                apply = calcCycle(entry, extractYmd(dt), Number(dc), todayYmd);
            }

            // css
            if (apply) {
                el.style.color = '#343434';
                el.classList.add('store-dayoff');
            } else {
                el.classList.remove('store-dayoff');
            }
        });
    }

    // MutationObserver
    function observerDayoff(dateSelector, todayYmd) {
        const container = document.querySelector('.Calendar') || document.body;
        // 먼저 기존에 있는 요소들에 적용
        dayoffCss(dateSelector, todayYmd);

        // 옵저버: 자식 노드 추가 시 새 요소에 대해 처리
        const observer = new MutationObserver((mutations) => {
            for (const m of mutations) {
            if (m.type !== 'childList' || m.addedNodes.length === 0) continue;
            m.addedNodes.forEach(node => {
                if (!(node instanceof Element)) return;
                // node 자신이 날짜 셀인지, 또는 내부에 날짜 셀들이 있는지 처리
                if (node.matches && node.matches(dateSelector)) {
                // 한 요소 처리
                dayoffCss(dateSelector, todayYmd); // 간단히 전체 다시 적용해도 무방
                } else {
                const inner = node.querySelectorAll && node.querySelectorAll(dateSelector);
                if (inner && inner.length) dayoffCss(dateSelector, todayYmd);
                }
            });
            }
        });

        observer.observe(container, { childList: true, subtree: true });
        return observer;
        // observer.disconnect(): 중지
    }

            }
            if (s.indexOf(',') !== -1){

    // formdata를 body에 바로 보내지말고, json으로 변환해서 보냄
    async function fetchSendForm(formData) {
        // FormData 객체를 일반 객체로 변환
        const formObject = {};
        for (let [key, value] of formData.entries()) {
            formObject[key] = value;
        }

        // 일반 객체를 JSON 문자열로 변환
        const json = JSON.stringify(formObject);

        const baseUrl = window.location.origin;
        const csrfToken = document.querySelector('input[name="csrfmiddlewaretoken"]').value;

        // const response = await fetch("send_msg/", {
        // const baseUrl = window.location.origin;
        // const response = await fetch(`$baseUrl/send_msg/`, {
        const response = await fetch(`${baseUrl}/`, {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'X-CSRFToken': csrfToken
            },
            body: json,
        })
        .then(async response => {
            let data;
            try {
                data = await response.json();
            } catch (e) {
                data = null;
            }

            if(!response.ok) {
                const msg = (data && data.message) ? data.message : '서버오류';
                alert(msg);
                throw new Error(msg);
            }
            return data;
        })
        .then(data => {
            if(data && data.status === 'success') {
                localStorage.removeItem('selected_date');
                console.log('localStorage 초기화됨');
                // console.log('response data', data);
                alert('성공적으로 예약되었습니다.');

            } else {
                const msg = (data && data.message) ? data.message : '처리실패';
                alert(msg);
                // console.log(data);
            }
        })
        .catch(error => {
            console.error(error);
            if (!error.message) {
                alert('에러발생. 다시 시도해주세요.');
            }
        });
    }


    // submit버튼누르면, 비동기로 데이터보내기
    // 여기는 비동기 함수 두개 실행시킬 함수로 빼기..
    document.getElementById('rsv_post').addEventListener('submit', function (e) {

        let formData = new FormData(this);

        console.log("formData", formData.entries());
        for (let [key, value] of formData.entries()) {
            console.log(`${key}: ${value}`);
        }
        fetchSendForm(formData);
    });
