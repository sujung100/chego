<script>
    let activate_result = false;
  
    function getErrorMessage(errorType) {
      const errorMessages = {
        "startDateMissing": "예약 활성화 시작일을 선택해 주세요.",
        "endDateMissing": "예약 활성화 종료일을 선택해 주세요.",
        "dateNotSelected": "예약 날짜를 선택해 주세요."
  
      };
  
      return errorMessages[errorType] || "알 수 없는 오류가 발생했습니다.";
    }
  
  
    function validateDates(start, end) {
      console.log("start", start);
      console.log("end", end);
      // 날짜가 선택되지 않은 경우
      if (!start || isNaN(new Date(start).getTime())) {
        return { valid: false, errorType: "startDateMissing" };
      }
      if (!end || isNaN(new Date(end).getTime())) {
        return { valid: false, errorType: "endDateMissing" };
      }
  
      // 시작일과 종료일을 Date 객체로 변환
      const start_type_date = new Date(start);
      const end_type_date = new Date(end);

      // 모든 유효성 검사를 통과한 경우
      return { valid: true };
    }
  
    // 변경 : fetch없앰 post요청 db저장 -> 웹소켓으로 처리
    
    // 기간설정 - 자동선택
    function sendAutoData(radioVal, today) {
      if (updateSocket.readyState === WebSocket.OPEN) {
        updateSocket.send(JSON.stringify({
          "command": "rsv_renewal_cycle",
          "renewal_cycle": radioVal,
          "set_date": today,
          "rsv_id": storeId,
        }));
      }
    }

    // 기간설정 - 수동선택(달력값)
    function sendManualData(start, end, today) {
      if (updateSocket.readyState === WebSocket.OPEN) {
        updateSocket.send(JSON.stringify({
          "command": "start_end_date",
          "start_date": start,
          "end_date": end,
          "set_date": today,
          "rsv_id": storeId,
        }));
      }
    }


    // 시간설정 - 시간값들
    function saveTimes(changeSave) {
      if (updateSocket.readyState === WebSocket.OPEN) {
        updateSocket.send(JSON.stringify({
          "command": "temporary",
          ...changeSave,
          "rsv_id": storeId,
        }));
      }
    }
    
    // 휴무설정
    function sendDayoffData(dayOffCycle, dayoff) {

      // 휴무일 안들어갔으면 F (휴무주기는 빈값이면 자동으로 매주선택)
      // if (!dayoff?.length) {
      //   console.warn("입력값 부족");
      //   return false;
      // }

      const noHoliday = (dayOffCycle === "무휴");
      const existHoliday = (Array.isArray(dayoff) && dayoff.length > 0);

      if (!noHoliday && !existHoliday) {
        console.warn("선택요일없음");
        return false;
      }

      if (updateSocket.readyState === WebSocket.OPEN) {
        updateSocket.send(JSON.stringify({
          "command": "dayoff_set",
          "dayoff_cycle": dayOffCycle,
          "dayoff": dayoff,
          "rsv_id": storeId,
        }));
        // 데이터 전송 성공시 T
        return true;
      }
      // 소켓연결 오류시 F
      return false;
    }
    
    // 인원설정
    function sendMaxNumData(maxPeople, maxTeam) {
      if (updateSocket.readyState === WebSocket.OPEN) {
        updateSocket.send(JSON.stringify({
          "command": "num_set",
          "max_people": maxPeople,
          "max_team": maxTeam,
          "rsv_id": storeId,
        }));
      }
    }




  </script>
